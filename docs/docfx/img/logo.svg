    <path d="M16 2.5v4" />
    <path d="M16 25.5v4" />
    <path d="M2.5 16h4" />
    <path d="M25.5 16h4" />
    <path d="M6.4 6.4l2.9 2.9" />
    <path d="M22.7 22.7l2.9 2.9" />
    <path d="M6.4 25.6l2.9-2.9" />
    <path d="M22.7 9.3l2.9-2.9" />
  </g>
  <circle cx="16" cy="16" r="7" fill="#ffbe2e" />
</svg>

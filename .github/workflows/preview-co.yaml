# AWS Tier 1: Colorado ephemeral preview environments in dev-co.
#
# Trigger: add the "preview-co" label to a pull request, or workflow_dispatch.
#
# Uses the dev-co GitHub environment for AWS credentials, ECR URLs, and DOMAIN.
# Reuses the shared dev RDS SQL Server (no per-PR database); preview API/Web run
# as separate ECS services alongside the existing dev-co stack. Preview tasks
# strip OTEL/AppConfig sidecars, so traces will not appear in Datadog.
#
# Prerequisites (dev-co environment / AWS):
#   - ACM certificates (API ALB + CloudFront) must cover pr-*.{DOMAIN} and api-pr-*.{DOMAIN}
#     via certificate_sans / cloudfront_extra_aliases (DOMAIN is often a subdomain, e.g. dev.co.*)
#   - CloudFront distribution must include *.{DOMAIN} as an alternate domain name
#   - Shared preview Keycloak at https://auth.{DOMAIN} (tofu module preview_keycloak); build/push
#     image via ./scripts/preview/build-keycloak.sh before first apply. Deploy registers each
#     pr-N host on the Keycloak clients via sebt-preview-deploy (client_credentials).
#     For an existing live realm, run ./scripts/preview/bootstrap-keycloak-deploy-client.sh
#     once (or create sebt-preview-deploy manually; see docs/development/keycloak-preview.md).
#   - Optional vars: PREVIEW_KEYCLOAK_DEPLOY_CLIENT_ID / PREVIEW_KEYCLOAK_DEPLOY_CLIENT_SECRET
#     or PREVIEW_KEYCLOAK_DEPLOY_SECRET_ID (Secrets Manager JSON)
#   - Optional: PREVIEW_KEYCLOAK_ADMIN_BYPASS_SECRET_ID (defaults to
#     sebt-portal-co-development-keycloak-admin-bypass) so Admin API calls past the ALB /admin* deny
#   - Create the "preview-co" label on this repository
#   - Set PREVIEW_BASE_API_SERVICE and PREVIEW_BASE_WEB_SERVICE before first deploy
#     (or rely on auto-discovery in per-role clusters: *-development-api / *-development-web)
#   - Optional vars: PREVIEW_API_ECS_CLUSTER, PREVIEW_WEB_ECS_CLUSTER, PREVIEW_ECS_CLUSTER,
#     PREVIEW_HOSTED_ZONE_ID (zone ID or apex name), PREVIEW_KEYCLOAK_HOSTNAME
#   - PREVIEW_API_SERVICE / PREVIEW_WEB_SERVICE are accepted aliases for the base services

name: Preview (CO Tier 1)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy or destroy a preview stack"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy
      pr_number:
        description: "PR number (required)"
        required: true
        type: string
      branch:
        description: "Git branch to build (deploy only; defaults to PR head branch)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-co-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview images
    timeout-minutes: 45
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview-co'))
    runs-on: ubuntu-latest
    environment: dev-co
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_BRANCH" ]; then
              echo "name=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
            else
              PR_HEAD="$(gh pr view "$INPUT_PR_NUMBER" \
                --repo "${GITHUB_REPOSITORY}" \
                --json headRefName \
                --jq .headRefName)"
              echo "name=${PR_HEAD}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "name=$GITHUB_HEAD_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout portal
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Compute image tag
        id: tag
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # state + co connectors are in-repo (apps/connectors/*).
      - name: Build plugin interfaces
        run: |
          dotnet build apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj \
            -c Release

      - name: Publish CO plugin
        run: |
          dotnet publish apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/SEBT.Portal.StatePlugins.CO.csproj \
            -c Release \
            -p:CopyPlugins=false

      - name: Stage plugin artifacts
        run: |
          mkdir -p nuget-store
          cp -r ~/nuget-store/* nuget-store/
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-co
          cp apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-co/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push API image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          ECR_API_REPOSITORY_URL: ${{ secrets.ECR_API_REPOSITORY_URL }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/portal/src/SEBT.Portal.Api/Dockerfile \
            -t "${ECR_API_REPOSITORY_URL}:${IMAGE_TAG}" \
            .
          docker push "${ECR_API_REPOSITORY_URL}:${IMAGE_TAG}"

      - name: Build and push Web image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          ECR_WEB_REPOSITORY_URL: ${{ secrets.ECR_WEB_REPOSITORY_URL }}
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_MIXPANEL_TOKEN: ${{ vars.MIXPANEL_TOKEN }}
          NEXT_PUBLIC_SITEIMPROVE_ID: ${{ vars.SITEIMPROVE_ID }}
          NEXT_PUBLIC_SMARTY_EMBEDDED_KEY: ${{ vars.SMARTY_EMBEDDED_KEY }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/portal/src/SEBT.Portal.Web/Dockerfile \
            --build-arg STATE=co \
            --build-arg NEXT_PUBLIC_MOCK_SOCURE=true \
            --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY="${NEXT_PUBLIC_AMPLITUDE_API_KEY}" \
            --build-arg NEXT_PUBLIC_MIXPANEL_TOKEN="${NEXT_PUBLIC_MIXPANEL_TOKEN}" \
            --build-arg NEXT_PUBLIC_SITEIMPROVE_ID="${NEXT_PUBLIC_SITEIMPROVE_ID}" \
            --build-arg NEXT_PUBLIC_SMARTY_EMBEDDED_KEY="${NEXT_PUBLIC_SMARTY_EMBEDDED_KEY}" \
            --build-arg NEXT_PUBLIC_BUILD_SHA="$(git rev-parse HEAD)" \
            -t "${ECR_WEB_REPOSITORY_URL}:${IMAGE_TAG}" \
            .
          docker push "${ECR_WEB_REPOSITORY_URL}:${IMAGE_TAG}"

  deploy:
    name: Deploy preview stack
    timeout-minutes: 30
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'preview-co'))
    runs-on: ubuntu-latest
    environment: dev-co
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy preview environment
        id: deploy
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          PREVIEW_DOMAIN: ${{ vars.DOMAIN }}
          PREVIEW_ECS_CLUSTER: ${{ vars.PREVIEW_ECS_CLUSTER }}
          PREVIEW_API_ECS_CLUSTER: ${{ vars.PREVIEW_API_ECS_CLUSTER }}
          PREVIEW_WEB_ECS_CLUSTER: ${{ vars.PREVIEW_WEB_ECS_CLUSTER }}
          PREVIEW_BASE_API_SERVICE: ${{ vars.PREVIEW_BASE_API_SERVICE }}
          PREVIEW_BASE_WEB_SERVICE: ${{ vars.PREVIEW_BASE_WEB_SERVICE }}
          PREVIEW_API_SERVICE: ${{ vars.PREVIEW_API_SERVICE }}
          PREVIEW_WEB_SERVICE: ${{ vars.PREVIEW_WEB_SERVICE }}
          PREVIEW_HOSTED_ZONE_ID: ${{ vars.PREVIEW_HOSTED_ZONE_ID }}
          PREVIEW_KEYCLOAK_DEPLOY_CLIENT_ID: ${{ vars.PREVIEW_KEYCLOAK_DEPLOY_CLIENT_ID }}
          PREVIEW_KEYCLOAK_DEPLOY_CLIENT_SECRET: ${{ secrets.PREVIEW_KEYCLOAK_DEPLOY_CLIENT_SECRET }}
          PREVIEW_KEYCLOAK_DEPLOY_SECRET_ID: ${{ vars.PREVIEW_KEYCLOAK_DEPLOY_SECRET_ID }}
          PREVIEW_KEYCLOAK_ADMIN_BYPASS_SECRET_ID: ${{ vars.PREVIEW_KEYCLOAK_ADMIN_BYPASS_SECRET_ID }}
          ECR_API_REPOSITORY_URL: ${{ secrets.ECR_API_REPOSITORY_URL }}
          ECR_WEB_REPOSITORY_URL: ${{ secrets.ECR_WEB_REPOSITORY_URL }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          OUTPUT="$(./scripts/preview/deploy-co.sh "${PR_NUMBER}" "${IMAGE_TAG}")"
          echo "${OUTPUT}"
          PREVIEW_URL="$(echo "${OUTPUT}" | awk -F= '/^preview_url=/{print $2}')"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Post preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-co -->';
            const body = [
              marker,
              '## AWS preview environment (CO Tier 1)',
              '',
              `**URL:** ${url}`,
              '',
              '**Smoke login (Keycloak):** fixture users from `docker/keycloak/sebt-realm.preview.json` (password `password`), for example username `verified`. OTP bypass also remains enabled.',
              '',
              'OIDC for previews uses the shared Keycloak at `https://auth.<DOMAIN>`.',
              'Deploy registers each `pr-N` host as a Valid Redirect URI on the Keycloak clients.',
              '',
              '_Previews share the dev-co database; seeded data and portal state are not isolated per PR._',
              '',
              '_Destroy runs automatically when this PR closes (idempotent if already torn down)._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Write job summary
        if: steps.deploy.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          echo "## Preview URL" >> "$GITHUB_STEP_SUMMARY"
          echo "${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy preview stack
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'destroy') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    environment: dev-co

    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Destroy preview environment
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          PREVIEW_DOMAIN: ${{ vars.DOMAIN }}
          PREVIEW_ECS_CLUSTER: ${{ vars.PREVIEW_ECS_CLUSTER }}
          PREVIEW_API_ECS_CLUSTER: ${{ vars.PREVIEW_API_ECS_CLUSTER }}
          PREVIEW_WEB_ECS_CLUSTER: ${{ vars.PREVIEW_WEB_ECS_CLUSTER }}
          PREVIEW_BASE_API_SERVICE: ${{ vars.PREVIEW_BASE_API_SERVICE }}
          PREVIEW_BASE_WEB_SERVICE: ${{ vars.PREVIEW_BASE_WEB_SERVICE }}
          PREVIEW_API_SERVICE: ${{ vars.PREVIEW_API_SERVICE }}
          PREVIEW_WEB_SERVICE: ${{ vars.PREVIEW_WEB_SERVICE }}
          PREVIEW_HOSTED_ZONE_ID: ${{ vars.PREVIEW_HOSTED_ZONE_ID }}
          PREVIEW_KEYCLOAK_DEPLOY_CLIENT_ID: ${{ vars.PREVIEW_KEYCLOAK_DEPLOY_CLIENT_ID }}
          PREVIEW_KEYCLOAK_DEPLOY_CLIENT_SECRET: ${{ secrets.PREVIEW_KEYCLOAK_DEPLOY_CLIENT_SECRET }}
          PREVIEW_KEYCLOAK_DEPLOY_SECRET_ID: ${{ vars.PREVIEW_KEYCLOAK_DEPLOY_SECRET_ID }}
          PREVIEW_KEYCLOAK_ADMIN_BYPASS_SECRET_ID: ${{ vars.PREVIEW_KEYCLOAK_ADMIN_BYPASS_SECRET_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          DESTROY_ARGS=("${PR_NUMBER}")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DESTROY_ARGS+=("--force")
          fi
          ./scripts/preview/destroy-co.sh "${DESTROY_ARGS[@]}"

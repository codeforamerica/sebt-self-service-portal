name: Plan infrastructure changes

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment for secrets'
        required: true
        type: string
      config:
        description: 'The OpenTofu configuration to plan'
        required: true
        type: string
      image_tag:
        description: 'Image tag variable for the plan'
        required: true
        type: string
    outputs:
      plan:
        description: "The plan output"
        value: ${{ jobs.plan.outputs.plan }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: us-east-1
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_private_subnets: ${{ vars.PRIVATE_SUBNETS }}
      TF_VAR_public_subnets: ${{ vars.PUBLIC_SUBNETS }}
    outputs:
      plan: ${{ steps.plan.outputs.stdout }}${{ steps.plan.outputs.stderr }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install DB rotation Lambda dependencies
        run: ./.github/workflows/scripts/install-rotation-lambda-deps.sh

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10.0"

      - name: Validate inputs
        env:
          CONFIG: ${{ inputs.config }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$CONFIG" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid config: $CONFIG"
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid image_tag: $IMAGE_TAG"
            exit 1
          fi

      - name: OpenTofu Init
        working-directory: tofu/config/${{ inputs.config }}
        run: tofu init -upgrade

      - name: OpenTofu Plan
        id: plan
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        working-directory: tofu/config/${{ inputs.config }}
        run: tofu plan -no-color -input=false -var="image_tag=${IMAGE_TAG}"

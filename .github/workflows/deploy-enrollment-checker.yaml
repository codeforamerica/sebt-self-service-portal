name: Deploy Enrollment Checker

on:
  push:
    branches: [main]
    paths:
      - apps/portal/src/SEBT.EnrollmentChecker.Web/**
      - packages/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-co:
    runs-on: ubuntu-latest
    environment: dev-co
    concurrency:
      group: deploy-enrollment-checker-co
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove SSR-only API routes
        run: rm -rf apps/portal/src/SEBT.EnrollmentChecker.Web/src/app/api

      - name: Build static export
        run: BUILD_STATIC=true pnpm --filter @sebt/enrollment-checker build
        env:
          STATE: co
          NEXT_PUBLIC_STATE: co
          # Required by the env schema as a fallback; config.js overrides it at runtime.
          NEXT_PUBLIC_PORTAL_URL: ${{ vars.ENROLLMENT_CHECKER_PORTAL_URL }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Write runtime client config
        # Browser config lives in the deployed bucket, not the bundle, so the same
        # export can be promoted between environments by rewriting this one file.
        # A variable left unset is left out of config.js and the checker keeps its
        # build-time default, so an integration stays off wherever it isn't set.
        # APPLICATION_URL is intentionally omitted as of Aug 28th while CO Summer EBT
        # applications are closed. Pass vars.ENROLLMENT_CHECKER_APPLICATION_URL as
        # APPLICATION_URL here once they reopen.
        env:
          API_BASE_URL: ${{ vars.ENROLLMENT_CHECKER_API_BASE_URL }}
          PORTAL_URL: ${{ vars.ENROLLMENT_CHECKER_PORTAL_URL }}
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
          MIXPANEL_TOKEN: ${{ vars.MIXPANEL_TOKEN }}
          SITEIMPROVE_ID: ${{ vars.SITEIMPROVE_ID }}
          META_PIXEL: ${{ vars.ENROLLMENT_CHECKER_META_PIXEL }}
          META_PIXEL_ACTION: ${{ vars.ENROLLMENT_CHECKER_META_PIXEL_ACTION }}
          ADENTIFI_PIXEL_LANDING: ${{ vars.ENROLLMENT_CHECKER_ADENTIFI_PIXEL_LANDING }}
          ADENTIFI_PIXEL_APPLY_NOW: ${{ vars.ENROLLMENT_CHECKER_ADENTIFI_PIXEL_APPLY_NOW }}
          SHOW_SCHOOL_FIELD: ${{ vars.ENROLLMENT_CHECKER_SHOW_SCHOOL_FIELD }}
          CHECKER_ENABLED: ${{ vars.ENROLLMENT_CHECKER_ENABLED }}
          BOT_PROTECTION_ENABLED: ${{ vars.ENROLLMENT_CHECKER_BOT_PROTECTION_ENABLED }}
        run: bash scripts/ci/write-checker-config.sh apps/portal/src/SEBT.EnrollmentChecker.Web/out/config.js

      - name: Upload static site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enrollment-checker-out-co
          path: apps/portal/src/SEBT.EnrollmentChecker.Web/out/
          retention-days: 1

  deploy-co:
    needs: build-co
    runs-on: ubuntu-latest
    environment: dev-co
    concurrency:
      group: deploy-enrollment-checker-co
      cancel-in-progress: true
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: enrollment-checker-out-co
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://${{ vars.ENROLLMENT_CHECKER_S3_BUCKET }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.ENROLLMENT_CHECKER_DISTRIBUTION_ID }}" \
            --paths "/*"

  build-dc:
    runs-on: ubuntu-latest
    environment: dev-dc
    concurrency:
      group: deploy-enrollment-checker-dc
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove SSR-only API routes
        run: rm -rf apps/portal/src/SEBT.EnrollmentChecker.Web/src/app/api

      - name: Build static export
        run: BUILD_STATIC=true pnpm --filter @sebt/enrollment-checker build
        env:
          STATE: dc
          NEXT_PUBLIC_STATE: dc
          # Required by the env schema as a fallback; config.js overrides it at runtime.
          NEXT_PUBLIC_PORTAL_URL: ${{ vars.ENROLLMENT_CHECKER_PORTAL_URL }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Write runtime client config
        # Browser config lives in the deployed bucket, not the bundle, so the same
        # export can be promoted between environments by rewriting this one file.
        # A variable left unset is left out of config.js and the checker keeps its
        # build-time default, so an integration stays off wherever it isn't set.
        # APPLICATION_URL is intentionally omitted as of Aug 24th while DC Summer EBT
        # applications are closed. Pass vars.ENROLLMENT_CHECKER_APPLICATION_URL as
        # APPLICATION_URL here once they reopen.
        env:
          API_BASE_URL: ${{ vars.ENROLLMENT_CHECKER_API_BASE_URL }}
          PORTAL_URL: ${{ vars.ENROLLMENT_CHECKER_PORTAL_URL }}
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
          MIXPANEL_TOKEN: ${{ vars.MIXPANEL_TOKEN }}
          SITEIMPROVE_ID: ${{ vars.SITEIMPROVE_ID }}
          META_PIXEL: ${{ vars.ENROLLMENT_CHECKER_META_PIXEL }}
          META_PIXEL_ACTION: ${{ vars.ENROLLMENT_CHECKER_META_PIXEL_ACTION }}
          ADENTIFI_PIXEL_LANDING: ${{ vars.ENROLLMENT_CHECKER_ADENTIFI_PIXEL_LANDING }}
          ADENTIFI_PIXEL_APPLY_NOW: ${{ vars.ENROLLMENT_CHECKER_ADENTIFI_PIXEL_APPLY_NOW }}
          SHOW_SCHOOL_FIELD: ${{ vars.ENROLLMENT_CHECKER_SHOW_SCHOOL_FIELD }}
          CHECKER_ENABLED: ${{ vars.ENROLLMENT_CHECKER_ENABLED }}
          BOT_PROTECTION_ENABLED: ${{ vars.ENROLLMENT_CHECKER_BOT_PROTECTION_ENABLED }}
        run: bash scripts/ci/write-checker-config.sh apps/portal/src/SEBT.EnrollmentChecker.Web/out/config.js

      - name: Upload static site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enrollment-checker-out-dc
          path: apps/portal/src/SEBT.EnrollmentChecker.Web/out/
          retention-days: 1

  deploy-dc:
    needs: build-dc
    runs-on: ubuntu-latest
    environment: dev-dc
    concurrency:
      group: deploy-enrollment-checker-dc
      cancel-in-progress: true
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: enrollment-checker-out-dc
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://${{ vars.ENROLLMENT_CHECKER_S3_BUCKET }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.ENROLLMENT_CHECKER_DISTRIBUTION_ID }}" \
            --paths "/*"

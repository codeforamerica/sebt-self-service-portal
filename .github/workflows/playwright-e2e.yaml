name: Playwright E2E

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Pinned third-party CI images/tools — avoid mutable :latest tags (Aikido supply-chain checks).
env:
  CI_MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04@sha256:45a1a9d13ca5574cf8e0fe4ae73ab77248b66d9c3132ac9658fb6c16dd72a8af
  CI_MAILPIT_IMAGE: axllent/mailpit:v1.30.2@sha256:37a38e48e9338cd7e89dfeb487f37b02ebfcd9cb23111bed2d345e79d37d6dd6
  CI_DOTNET_EF_VERSION: "10.0.9"

jobs:
  # Same fail-open change detection as state-ci.yaml: PRs skip jobs whose inputs
  # didn't change; pushes and CI-infra changes always run everything.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      enrollment: ${{ steps.decide.outputs.enrollment }}
    steps:
      - name: Filter changed paths (PRs only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            infra:
              - '.github/**'
              - 'scripts/**'
              - '.husky/**'
              - 'Dockerfile'
              - 'compose.yaml'
              - 'package.json'
            backend:
              - 'apps/portal/src/**'
              - '!apps/portal/src/SEBT.Portal.Web/**'
              - '!apps/portal/src/SEBT.EnrollmentChecker.Web/**'
              - 'apps/portal/test/**'
              - 'apps/connectors/**'
              - 'SEBT.slnx'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - '.editorconfig'
            frontend:
              - 'apps/portal/src/SEBT.Portal.Web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            enrollment:
              - 'apps/portal/src/SEBT.EnrollmentChecker.Web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      - name: Decide which areas run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INFRA: ${{ steps.filter.outputs.infra }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          ENROLLMENT: ${{ steps.filter.outputs.enrollment }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$INFRA" = "true" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "enrollment=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND:-false}" >> "$GITHUB_OUTPUT"
            echo "enrollment=${ENROLLMENT:-false}" >> "$GITHUB_OUTPUT"
          fi

  # E2E drives the web app alone (MSW mocks the API), so backend-only changes
  # can't affect it.
  e2e:
    name: Playwright E2E Tests (${{ matrix.state }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        state: [dc, co]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright browsers
        run: cd apps/portal/src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Build frontend for E2E
        env:
          STATE: ${{ matrix.state }}
          NEXT_PUBLIC_STATE: ${{ matrix.state }}
        run: ./.github/workflows/scripts/build-frontend.sh --production

      - name: Run Playwright E2E tests
        env:
          CI: true
          SKIP_WEB_SERVER: "1"
          STATE: ${{ matrix.state }}
          NEXT_PUBLIC_STATE: ${{ matrix.state }}
        run: |
          (cd apps/portal/src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for server at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Server ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Server failed to start" && exit 1)
          echo "Running Playwright E2E tests..."
          pnpm ci:test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: playwright-report-${{ matrix.state }}
          path: apps/portal/src/SEBT.Portal.Web/playwright-report/
          retention-days: 7

  # Integration E2E drives the full stack (real API + web), so it reacts to both areas.
  # The enrollment checker's suite mocks its API at the browser level, so it
  # only needs the Next dev server the Playwright config boots itself.
  e2e-checker:
    name: Enrollment Checker E2E (CO)
    needs: changes
    if: needs.changes.outputs.enrollment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright browsers
        run: cd apps/portal/src/SEBT.EnrollmentChecker.Web && pnpm exec playwright install --with-deps chromium

      - name: Run enrollment checker E2E tests
        env:
          CI: true
        run: pnpm ci:test:e2e:checker

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: playwright-report-checker
          path: apps/portal/src/SEBT.EnrollmentChecker.Web/playwright-report/
          retention-days: 7

  e2e-integration-dc:
    name: Playwright Integration E2E (DC)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Repository secrets are absent on Dependabot and fork PRs; the connector
    # steps below check this so those runs skip staging instead of failing.
    env:
      HAS_CONNECTOR_ACCESS: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_ID != '' }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04@sha256:45a1a9d13ca5574cf8e0fe4ae73ab77248b66d9c3132ac9658fb6c16dd72a8af
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C -b -o /dev/null || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

      mailpit:
        image: axllent/mailpit:v1.30.2@sha256:37a38e48e9338cd7e89dfeb487f37b02ebfcd9cb23111bed2d345e79d37d6dd6
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # state connector (interfaces) is now in-repo at apps/connectors/state — no checkout needed.

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Staging the real DC plugin is what makes this job exercise plugin loading.
      # With plugins-dc/ empty the loader has nothing to bind, so a host/plugin
      # assembly version conflict passes CI and only surfaces as a crash-looping
      # ECS task that the deployment circuit breaker silently rolls back.
      #
      # Skipped when the connector token is unavailable — Dependabot and fork PRs
      # don't receive repository secrets. Those runs keep the previous behaviour
      # (empty plugins-dc) rather than failing on a secret they can never have.
      - name: Get dc-connector access token
        if: env.HAS_CONNECTOR_ACCESS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: dc-connector-token
        with:
          app-id: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_PRIVATE_KEY }}
          owner: codeforamerica
          repositories: sebt-self-service-portal-dc-connector

      # Same branch-matching as deploy-ecr.yaml and release-iis-dc.yaml: paired
      # contract changes need the dc-connector branch of the same name; everything
      # else falls back to main. The matched branch resolves to a commit SHA so the
      # checkout is pinned — no window for the branch to move between resolution
      # and checkout.
      - name: Determine dc-connector ref
        if: env.HAS_CONNECTOR_ACCESS == 'true'
        id: dc-connector-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONNECTOR_TOKEN: ${{ steps.dc-connector-token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid git ref: branch=$BRANCH"
            exit 1
          fi
          if [ -z "$CONNECTOR_TOKEN" ]; then
            echo "::error::dc-connector app token is empty — check the create-github-app-token step above"
            exit 1
          fi
          # Authenticate exactly the way actions/checkout does (basic auth header) —
          # URL-embedded credentials are rejected for this token and would also leak
          # into error output.
          AUTH_HEADER="AUTHORIZATION: basic $(printf '%s' "x-access-token:${CONNECTOR_TOKEN}" | base64 | tr -d '\n')"
          REPO_URL="https://github.com/${REPO_OWNER}/sebt-self-service-portal-dc-connector.git"
          # Run outside the portal checkout: its persisted GITHUB_TOKEN auth header
          # would override ours and 404 on the private connector repo.
          if ! LS_OUT=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/${BRANCH}" 2>&1); then
            echo "::error::dc-connector ls-remote failed: ${LS_OUT}"
            exit 1
          fi
          RESOLVED="$BRANCH"
          SHA=$(printf '%s\n' "$LS_OUT" | cut -f1 | head -1)
          if [ -z "$SHA" ]; then
            RESOLVED="main"
            SHA=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/main" | cut -f1 | head -1)
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve dc-connector ${RESOLVED} to a commit SHA"
            exit 1
          fi
          echo "Resolved dc-connector ${RESOLVED} -> ${SHA}"
          echo "ref=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout dc-connector
        if: env.HAS_CONNECTOR_ACCESS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: codeforamerica/sebt-self-service-portal-dc-connector
          token: ${{ steps.dc-connector-token.outputs.token }}
          ref: ${{ steps.dc-connector-ref.outputs.ref }}
          path: dc-connector

      # Must run before "Build backend": the API csproj folds plugins-dc/**/*.dll
      # into its output, and the running API loads the plugin from there.
      - name: Stage DC plugin into plugins-dc
        if: env.HAS_CONNECTOR_ACCESS == 'true'
        run: |
          dotnet build apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj \
            -c Release
          # dc-connector has no committed lockfile (deliberate — see the locked-mode ADR);
          # exempt this out-of-tree restore so CI locked mode doesn't fail it.
          dotnet publish dc-connector/src/SEBT.Portal.StatePlugins.DC/SEBT.Portal.StatePlugins.DC.csproj \
            -c Release \
            -p:CopyPlugins=false \
            -p:RestoreLockedMode=false \
            -p:StateConnectorInterfacesProject="$GITHUB_WORKSPACE/apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj"
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-dc
          cp dc-connector/src/SEBT.Portal.StatePlugins.DC/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-dc/
          echo "Staged $(ls apps/portal/src/SEBT.Portal.Api/plugins-dc/*.dll | wc -l) plugin DLLs"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: ./.github/workflows/scripts/build-backend.sh --configuration Release

      - name: Build frontend for integration E2E
        env:
          STATE: dc
          NEXT_PUBLIC_STATE: dc
        run: ./.github/workflows/scripts/build-frontend.sh --production --skip-install

      - name: Install Playwright browsers
        run: cd apps/portal/src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version "$CI_DOTNET_EF_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Initialize SQL Server Database
        env:
          ASPNETCORE_ENVIRONMENT: Development
          STATE: dc
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"

          CONN="Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          SA_PASSWORD='YourStrong@Passw0rd'
          SQLCMD_IMAGE="$CI_MSSQL_IMAGE"

          run_sqlcmd() {
            docker run --rm --network host "$SQLCMD_IMAGE" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b "$@"
          }

          # Wait for SQL Server to accept connections from the job host (service health runs inside the container).
          for i in $(seq 1 30); do
            if run_sqlcmd -Q 'SELECT 1' -o /dev/null 2>&1; then
              echo "SQL Server ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SQL Server did not become ready in time"
              exit 1
            fi
            sleep 1
          done

          echo "Creating SebtPortal database if missing..."
          run_sqlcmd -Q "IF DB_ID(N'SebtPortal') IS NULL CREATE DATABASE [SebtPortal];"

          for attempt in $(seq 1 3); do
            echo "Applying EF migrations (attempt ${attempt}/3)..."
            if dotnet ef database update \
              --project apps/portal/src/SEBT.Portal.Infrastructure/SEBT.Portal.Infrastructure.csproj \
              --startup-project apps/portal/src/SEBT.Portal.Api/SEBT.Portal.Api.csproj \
              --configuration Release \
              --no-build \
              --connection "$CONN"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "EF migrations failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

          echo "Verifying SebtPortal schema..."
          run_sqlcmd -d SebtPortal -Q "IF OBJECT_ID(N'__EFMigrationsHistory', N'U') IS NULL RAISERROR('Missing __EFMigrationsHistory', 16, 1); SELECT TOP 1 MigrationId FROM __EFMigrationsHistory;"
          echo "Database initialization complete"

      - name: Run Playwright integration E2E tests
        env:
          CI: true
          E2E_FULL_STACK: "1"
          SKIP_WEB_SERVER: "1"
          STATE: dc
          NEXT_PUBLIC_STATE: dc
          BACKEND_URL: http://localhost:5280
          MAILPIT_API_URL: http://localhost:8025
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          JwtSettings__SecretKey: "ci-e2e-jwt-secret-at-least-32-characters-long"
          IdentifierHasher__SecretKey: "ci-e2e-identifier-hasher-key-32chars"
          Oidc__CompleteLoginSigningKey: "ci-e2e-oidc-signing-key-at-least-32-chars"
          PluginAssemblyPaths__0: "plugins-dc"
          Seeding__State: dc
          Seeding__EmailPattern: "sebt.dc+{0}@codeforamerica.org"
          UseMockHouseholdData: "true"
          Socure__UseStub: "true"
          SmtpClientSettings__SmtpServer: "localhost"
          SmtpClientSettings__SmtpPort: "1025"
          SmtpClientSettings__EnableSsl: "false"
          OtpRateLimitSettings__PermitLimit: "30"
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project apps/portal/src/SEBT.Portal.Api --launch-profile http --configuration Release --no-build &
          (cd apps/portal/src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for API at http://localhost:5280/health..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:5280/health > /dev/null && echo "API ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:5280/health > /dev/null || (echo "API failed to start" && exit 1)
          echo "Waiting for web app at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Web ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Web failed to start" && exit 1)
          echo "Running Playwright integration E2E tests..."
          pnpm ci:test:e2e:integration

      - name: Upload Playwright integration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: playwright-integration-report-dc
          path: apps/portal/src/SEBT.Portal.Web/playwright-report/
          retention-days: 7

  # Full-stack Colorado sign-in through the compose Keycloak stand-in for
  # myColorado: a real OIDC credential dance, not cookie injection. Keycloak
  # runs via docker compose (not a service container) because the realm import
  # needs the checked-out repo's fixture files.
  e2e-integration-co:
    name: Playwright Integration E2E (CO)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04@sha256:45a1a9d13ca5574cf8e0fe4ae73ab77248b66d9c3132ac9658fb6c16dd72a8af
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C -b -o /dev/null || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start Keycloak (myColorado stand-in)
        run: |
          docker compose --profile keycloak up -d keycloak
          echo "Waiting for Keycloak discovery document..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/sebt/.well-known/openid-configuration > /dev/null && echo "Keycloak ready" && break
            sleep 2
          done
          curl -sf http://localhost:8180/realms/sebt/.well-known/openid-configuration > /dev/null || (echo "Keycloak failed to start" && docker logs sebt_keycloak | tail -50 && exit 1)

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: ./.github/workflows/scripts/build-backend.sh --configuration Release

      - name: Build frontend for integration E2E
        env:
          STATE: co
          NEXT_PUBLIC_STATE: co
        run: ./.github/workflows/scripts/build-frontend.sh --production --skip-install

      - name: Install Playwright browsers
        run: cd apps/portal/src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version "$CI_DOTNET_EF_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Initialize SQL Server Database
        env:
          ASPNETCORE_ENVIRONMENT: Development
          STATE: co
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"

          CONN="Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          SA_PASSWORD='YourStrong@Passw0rd'
          SQLCMD_IMAGE="$CI_MSSQL_IMAGE"

          run_sqlcmd() {
            docker run --rm --network host "$SQLCMD_IMAGE" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b "$@"
          }

          for i in $(seq 1 30); do
            if run_sqlcmd -Q 'SELECT 1' -o /dev/null 2>&1; then
              echo "SQL Server ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SQL Server did not become ready in time"
              exit 1
            fi
            sleep 1
          done

          echo "Creating SebtPortal database if missing..."
          run_sqlcmd -Q "IF DB_ID(N'SebtPortal') IS NULL CREATE DATABASE [SebtPortal];"

          for attempt in $(seq 1 3); do
            echo "Applying EF migrations (attempt ${attempt}/3)..."
            if dotnet ef database update \
              --project apps/portal/src/SEBT.Portal.Infrastructure/SEBT.Portal.Infrastructure.csproj \
              --startup-project apps/portal/src/SEBT.Portal.Api/SEBT.Portal.Api.csproj \
              --configuration Release \
              --no-build \
              --connection "$CONN"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "EF migrations failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Run Playwright integration E2E tests
        env:
          CI: true
          E2E_FULL_STACK: "1"
          SKIP_WEB_SERVER: "1"
          STATE: co
          NEXT_PUBLIC_STATE: co
          BACKEND_URL: http://localhost:5280
          # No Mailpit in the CO stack — the checker/DC OTP flow doesn't run here.
          MAILPIT_API_URL: ""
          KEYCLOAK_DISCOVERY_URL: http://localhost:8180/realms/sebt/.well-known/openid-configuration
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          JwtSettings__SecretKey: "ci-e2e-jwt-secret-at-least-32-characters-long"
          IdentifierHasher__SecretKey: "ci-e2e-identifier-hasher-key-32chars"
          # The CO overlay expects TLS Redis; the single-instance e2e stack uses
          # the in-memory stores instead.
          Redis__Host: ""
          Oidc__DiscoveryEndpoint: http://localhost:8180/realms/sebt/.well-known/openid-configuration
          Oidc__ClientId: sebt-portal
          Oidc__ClientSecret: sebt-portal-dev-secret
          Oidc__CallbackRedirectUri: http://localhost:3000/callback
          Oidc__CompleteLoginSigningKey: "ci-e2e-oidc-signing-key-at-least-32-chars"
          Oidc__StepUp__DiscoveryEndpoint: http://localhost:8180/realms/sebt/.well-known/openid-configuration
          Oidc__StepUp__ClientId: sebt-portal-stepup
          Oidc__StepUp__ClientSecret: sebt-portal-stepup-dev-secret
          PluginAssemblyPaths__0: "plugins-co"
          UseMockHouseholdData: "true"
          Cbms__UseMockResponses: "true"
        run: |
          # The CO overlay (IAL requirements, phone-based household ids, seeding)
          # ships as an example file; the env above overrides its Redis/OIDC bits.
          cp apps/portal/src/SEBT.Portal.Api/appsettings.co.example.json apps/portal/src/SEBT.Portal.Api/appsettings.co.json
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project apps/portal/src/SEBT.Portal.Api --launch-profile http --configuration Release --no-build &
          (cd apps/portal/src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for API at http://localhost:5280/health..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:5280/health > /dev/null && echo "API ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:5280/health > /dev/null || (echo "API failed to start" && exit 1)
          echo "Waiting for web app at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Web ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Web failed to start" && exit 1)
          echo "Running Playwright integration E2E tests..."
          pnpm ci:test:e2e:integration:co

      - name: Upload Playwright integration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: playwright-integration-report-co
          path: apps/portal/src/SEBT.Portal.Web/playwright-report/
          retention-days: 7

  # Pa11y runs the full stack (real API + web), so it reacts to both areas.
  a11y:
    name: Pa11y Accessibility Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04@sha256:45a1a9d13ca5574cf8e0fe4ae73ab77248b66d9c3132ac9658fb6c16dd72a8af
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C -b -o /dev/null || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # state connector (interfaces) is now in-repo at apps/connectors/state — no checkout needed.

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: ./.github/workflows/scripts/build-backend.sh --configuration Release

      - name: Build frontend for Pa11y
        env:
          STATE: dc
          NEXT_PUBLIC_STATE: dc
        run: ./.github/workflows/scripts/build-frontend.sh --production --skip-install

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for Pa11y
        run: cd apps/portal/src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Run Pa11y accessibility tests
        env:
          CI: true
          SKIP_WEB_SERVER: "1"
          STATE: dc
          NEXT_PUBLIC_STATE: dc
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          JwtSettings__SecretKey: "ci-e2e-jwt-secret-at-least-32-characters-long"
          IdentifierHasher__SecretKey: "ci-e2e-identifier-hasher-key-32chars"
          Oidc__CompleteLoginSigningKey: "ci-e2e-oidc-signing-key-at-least-32-chars"
          PluginAssemblyPaths__0: "plugins-dc"
          Seeding__State: dc
          Seeding__EmailPattern: "sebt.dc+{0}@codeforamerica.org"
          UseMockHouseholdData: "true"
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project apps/portal/src/SEBT.Portal.Api --launch-profile http --configuration Release --no-build &
          (cd apps/portal/src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for server at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Server ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Server failed to start" && exit 1)
          export PUPPETEER_EXECUTABLE_PATH="$(cd apps/portal/src/SEBT.Portal.Web && node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath());")"
          if [ -z "$PUPPETEER_EXECUTABLE_PATH" ] || [ ! -x "$PUPPETEER_EXECUTABLE_PATH" ]; then
            echo "Chromium verification failed: Playwright did not report an executable path"
            exit 1
          fi
          echo "Pa11y will use Chromium at $PUPPETEER_EXECUTABLE_PATH"
          echo "Running Pa11y accessibility tests..."
          pnpm ci:test:a11y

name: Playwright E2E

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e:
    name: Playwright E2E Tests (${{ matrix.state }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        state: [dc, co]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright browsers
        run: cd src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Build frontend for E2E
        env:
          STATE: ${{ matrix.state }}
          NEXT_PUBLIC_STATE: ${{ matrix.state }}
        run: ./.github/workflows/scripts/build-frontend.sh --production

      - name: Run Playwright E2E tests
        env:
          CI: true
          SKIP_WEB_SERVER: "1"
          STATE: ${{ matrix.state }}
          NEXT_PUBLIC_STATE: ${{ matrix.state }}
        run: |
          (cd src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for server at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Server ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Server failed to start" && exit 1)
          echo "Running Playwright E2E tests..."
          pnpm ci:test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report-${{ matrix.state }}
          path: src/SEBT.Portal.Web/playwright-report/
          retention-days: 7

  e2e-integration-dc:
    name: Playwright Integration E2E (DC)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C -b -o /dev/null || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine state connector ref
        id: connector-ref
        run: |
          BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          FALLBACK="${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/sebt-self-service-portal-state-connector.git"
          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/${BRANCH}" 1>/dev/null 2>&1; then
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${FALLBACK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout state connector
        uses: actions/checkout@v4
        with:
          repository: codeforamerica/sebt-self-service-portal-state-connector
          ref: ${{ steps.connector-ref.outputs.ref }}
          path: state-connector

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.200"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: ./.github/workflows/scripts/build-backend.sh --configuration Release

      - name: Build frontend for integration E2E
        env:
          STATE: dc
          NEXT_PUBLIC_STATE: dc
        run: ./.github/workflows/scripts/build-frontend.sh --production --skip-install

      - name: Install Playwright browsers
        run: cd src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Initialize SQL Server Database
        env:
          ASPNETCORE_ENVIRONMENT: Development
          STATE: dc
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;"
        run: |
          # Wait for SQL Server to accept connections from the job host (service health runs inside the container).
          for i in $(seq 1 30); do
            if docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest \
              /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' -C -b -o /dev/null 2>&1; then
              echo "SQL Server ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SQL Server did not become ready in time"
              exit 1
            fi
            sleep 1
          done

          dotnet ef database update \
            --project src/SEBT.Portal.Infrastructure/SEBT.Portal.Infrastructure.csproj \
            --startup-project src/SEBT.Portal.Api/SEBT.Portal.Api.csproj \
            --configuration Release \
            --no-build

      - name: Run Playwright integration E2E tests
        env:
          CI: true
          E2E_FULL_STACK: "1"
          SKIP_WEB_SERVER: "1"
          STATE: dc
          NEXT_PUBLIC_STATE: dc
          BACKEND_URL: http://localhost:5280
          MAILPIT_API_URL: http://localhost:8025
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          JwtSettings__SecretKey: "ci-e2e-jwt-secret-at-least-32-characters-long"
          IdentifierHasher__SecretKey: "ci-e2e-identifier-hasher-key-32chars"
          Oidc__CompleteLoginSigningKey: "ci-e2e-oidc-signing-key-at-least-32-chars"
          PluginAssemblyPaths__0: "plugins-dc"
          UseMockHouseholdData: "true"
          Socure__UseStub: "true"
          SmtpClientSettings__SmtpServer: "localhost"
          SmtpClientSettings__SmtpPort: "1025"
          SmtpClientSettings__EnableSsl: "false"
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/SEBT.Portal.Api --launch-profile http --configuration Release --no-build &
          (cd src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for API at http://localhost:5280/health..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:5280/health > /dev/null && echo "API ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:5280/health > /dev/null || (echo "API failed to start" && exit 1)
          echo "Waiting for web app at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Web ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Web failed to start" && exit 1)
          echo "Running Playwright integration E2E tests..."
          pnpm ci:test:e2e:integration

      - name: Upload Playwright integration report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-integration-report-dc
          path: src/SEBT.Portal.Web/playwright-report/
          retention-days: 7

  a11y:
    name: Pa11y Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' -C -b -o /dev/null || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine state connector ref
        id: connector-ref
        run: |
          BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          FALLBACK="${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/sebt-self-service-portal-state-connector.git"
          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/${BRANCH}" 1>/dev/null 2>&1; then
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${FALLBACK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout state connector
        uses: actions/checkout@v4
        with:
          repository: codeforamerica/sebt-self-service-portal-state-connector
          ref: ${{ steps.connector-ref.outputs.ref }}
          path: state-connector

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.200"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: ./.github/workflows/scripts/build-backend.sh --configuration Release

      - name: Build frontend for Pa11y
        env:
          STATE: dc
          NEXT_PUBLIC_STATE: dc
        run: ./.github/workflows/scripts/build-frontend.sh --production --skip-install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for Pa11y
        run: cd src/SEBT.Portal.Web && pnpm exec playwright install --with-deps chromium

      - name: Run Pa11y accessibility tests
        env:
          CI: true
          SKIP_WEB_SERVER: "1"
          STATE: dc
          NEXT_PUBLIC_STATE: dc
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SebtPortal;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
          JwtSettings__SecretKey: "ci-e2e-jwt-secret-at-least-32-characters-long"
          IdentifierHasher__SecretKey: "ci-e2e-identifier-hasher-key-32chars"
          Oidc__CompleteLoginSigningKey: "ci-e2e-oidc-signing-key-at-least-32-chars"
          PluginAssemblyPaths__0: "plugins-dc"
          UseMockHouseholdData: "true"
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/SEBT.Portal.Api --launch-profile http --configuration Release --no-build &
          (cd src/SEBT.Portal.Web && pnpm start) &
          echo "Waiting for server at http://localhost:3000..."
          for i in $(seq 1 90); do
            curl -sf --max-time 15 http://localhost:3000 > /dev/null && echo "Server ready" && break
            sleep 2
          done
          curl -sf --max-time 15 http://localhost:3000 > /dev/null || (echo "Server failed to start" && exit 1)
          export PUPPETEER_EXECUTABLE_PATH="$(cd src/SEBT.Portal.Web && node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath());")"
          if [ -z "$PUPPETEER_EXECUTABLE_PATH" ] || [ ! -x "$PUPPETEER_EXECUTABLE_PATH" ]; then
            echo "Chromium verification failed: Playwright did not report an executable path"
            exit 1
          fi
          echo "Pa11y will use Chromium at $PUPPETEER_EXECUTABLE_PATH"
          echo "Running Pa11y accessibility tests..."
          pnpm ci:test:a11y

name: Tofu Module Tests

on:
  push:
    branches: ["main"]
    paths:
      - "tofu/modules/sebt_database/lambda/**"
      - "tofu/modules/sebt_ses/lambda/**"
      - "tofu/modules/sebt_enrollment_checker/functions/**"
  pull_request:
    branches: ["main"]
    paths:
      - "tofu/modules/sebt_database/lambda/**"
      - "tofu/modules/sebt_ses/lambda/**"
      - "tofu/modules/sebt_enrollment_checker/functions/**"

permissions:
  contents: read

jobs:
  test-db-rotation-lambda:
    name: DB rotation Lambda unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tofu/modules/sebt_database/lambda/requirements.txt -r tofu/modules/sebt_database/lambda/requirements-test.txt

      - name: Run tests
        run: pytest tofu/modules/sebt_database/lambda/test_rotate_db_credentials.py -v

  test-ses-rotation-lambda:
    name: SES rotation Lambda unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tofu/modules/sebt_ses/lambda/requirements-test.txt

      - name: Run tests
        run: pytest tofu/modules/sebt_ses/lambda/test_rotate_smtp_credentials.py -v

  # The enrollment checker's CloudFront Function. JavaScript rather than Python
  # because the CloudFront Functions runtime accepts nothing else; tested with
  # node's built-in runner so it needs no dependencies.
  test-checker-cloudfront-function:
    name: Enrollment checker CloudFront Function unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run tests
        run: node --test tofu/modules/sebt_enrollment_checker/functions/rewrite-static-export-uri.test.mjs

# Release IIS Package — DC
# Builds an IIS deployment bundle for DC as an additional delivery option
# alongside the existing Docker/ECR process: API + web + dacpac + README +
# schema-change report.
#
# Triggers:
#   - workflow_dispatch (manual; produces a build artifact for download)
#   - pull_request (validation only — no artifact published)
#
# Releases are created manually from the workflow_dispatch artifact.
# The tag-push trigger and Create GitHub Release step are commented out
# below; revive them when we're ready to automate releases.

name: Release IIS Package — DC

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the bundle (default: dev-{shortsha})"
        required: false
        type: string
  pull_request:
    branches:
      - main
#  push:
#    tags:
#      - "release/dc-v*"

jobs:
  build:
    name: Build DC IIS bundle
    runs-on: ubuntu-latest
    # Bind release-producing triggers (workflow_dispatch + tag push) to prod-dc
    # so client-side NEXT_PUBLIC_* vars resolve from real prod values. PR runs
    # bind to prod-dc-test, which holds non-empty sentinel values — that way
    # every PR validates the full var-threading pipeline end-to-end before
    # merge, without exposing real prod keys in PR artifacts.
    environment: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/release/dc-v')) && 'prod-dc' || github.event_name == 'pull_request' && 'prod-dc-test' || '' }}
    permissions:
      contents: write # needed to upload artifacts
    env:
      STATE: dc

    steps:
      - name: Checkout portal
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          GIT_SHA="$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/release/dc-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/release/dc-v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="dev-$GIT_SHA"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine dc-connector ref
        id: dc-connector-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONNECTOR_PAT: ${{ secrets.SEBT_CONNECTOR_REPOSITORY_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid git ref: branch=$BRANCH"
            exit 1
          fi
          FALLBACK="main"
          REPO_URL="https://x-access-token:${CONNECTOR_PAT}@github.com/${REPO_OWNER}/sebt-self-service-portal-dc-connector.git"
          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/${BRANCH}" 1>/dev/null 2>&1; then
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${FALLBACK}" >> "$GITHUB_OUTPUT"
          fi

      # state connector (interfaces) is now in-repo at apps/connectors/state.
      - name: Checkout dc-connector (DC plugin implementation)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: codeforamerica/sebt-self-service-portal-dc-connector
          token: ${{ secrets.SEBT_CONNECTOR_REPOSITORY_PAT }}
          ref: ${{ steps.dc-connector-ref.outputs.ref }}
          path: dc-connector

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "10"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dotnet-ef and sqlpackage
        run: |
          dotnet tool install --global dotnet-ef
          dotnet tool install --global Microsoft.SqlPackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build backend
        # CopyPlugins=false: this is a validation build — plugin DLLs are staged
        # explicitly below, and the DC bundle must not pick up other states' plugins.
        run: ./scripts/ci/build-backend.sh --configuration Release -p:BuildFrontend=false -p:CopyPlugins=false

      - name: Build plugin interfaces (NuGet package)
        run: |
          dotnet build apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj \
            -c Release

      - name: Publish DC plugin
        run: |
          dotnet publish dc-connector/src/SEBT.Portal.StatePlugins.DC/SEBT.Portal.StatePlugins.DC.csproj \
            -c Release \
            -p:CopyPlugins=false \
            -p:StateConnectorInterfacesProject="$GITHUB_WORKSPACE/apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj"

      - name: Stage plugin artifacts for IIS publish
        run: |
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-dc
          cp dc-connector/src/SEBT.Portal.StatePlugins.DC/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-dc/

      - name: Publish API for IIS
        run: ./scripts/ci/publish-api.sh --output staging --configuration Release

      - name: Build and package frontend
        # NEXT_PUBLIC_* values are inlined into the client bundle at build time
        # (Next.js webpack-replaces them; web.config runtime env vars cannot
        # rescue them after the fact). These resolve from prod-dc on release
        # triggers, from prod-dc-test on PR runs (sentinel values for plumbing
        # validation), and from empty otherwise.
        env:
          NEXT_PUBLIC_SMARTY_EMBEDDED_KEY: ${{ vars.SMARTY_EMBEDDED_KEY }}
          NEXT_PUBLIC_SOCURE_SDK_KEY: ${{ vars.SOCURE_SDK_KEY }}
          NEXT_PUBLIC_SOCURE_DI_SDK_KEY: ${{ vars.SOCURE_DI_SDK_KEY }}
          NEXT_PUBLIC_MOCK_SOCURE: ${{ vars.MOCK_SOCURE }}
          NEXT_PUBLIC_SITEIMPROVE_ID: ${{ vars.SITEIMPROVE_ID }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          ./.github/workflows/scripts/build-frontend.sh --production
          ./scripts/ci/package-frontend.sh --skip-build --output output/sebt-web.zip

      - name: Extract DACPAC
        run: ./scripts/ci/extract-dacpac.sh --output "output/sebt-portal-${{ steps.ver.outputs.version }}.dacpac"

      - name: Generate DACPAC report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/ci/generate-dacpac-report.sh \
            --dacpac "output/sebt-portal-${{ steps.ver.outputs.version }}.dacpac" \
            --output-dir output/dacpac-report \
            --prev-tag-pattern "release/dc-v*" \
            --repo "${{ github.repository }}"

      - name: Bundle IIS package
        run: |
          ./scripts/ci/bundle-iis-package.sh \
            --api-dir staging/api \
            --web-zip output/sebt-web.zip \
            --dacpac "output/sebt-portal-${{ steps.ver.outputs.version }}.dacpac" \
            --changelog output/dacpac-report/CHANGELOG-DACPAC.md \
            --deploy-report-xml output/dacpac-report/deploy-report.xml \
            --deploy-report-html output/dacpac-report/deploy-report.html \
            --version "${{ steps.ver.outputs.version }}" \
            --git-sha "${{ steps.ver.outputs.git_sha }}" \
            --output "output/sebt-dc-iis-${{ steps.ver.outputs.version }}.zip"

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sebt-dc-iis-${{ steps.ver.outputs.version }}
          path: |
            output/sebt-dc-iis-${{ steps.ver.outputs.version }}.zip
            output/sebt-portal-${{ steps.ver.outputs.version }}.dacpac
          retention-days: 90

      # - name: Create GitHub Release (tag push)
      #   if: startsWith(github.ref, 'refs/tags/release/dc-v')
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh release create "${GITHUB_REF#refs/tags/}" \
      #       "output/sebt-dc-iis-${{ steps.ver.outputs.version }}.zip" \
      #       "output/sebt-portal-${{ steps.ver.outputs.version }}.dacpac" \
      #       --title "DC v${{ steps.ver.outputs.version }}" \
      #       --notes-file "output/dacpac-report/CHANGELOG-DACPAC.md"

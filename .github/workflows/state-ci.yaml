# State-based CI Workflow
# build-and-test runs once (not once per state -- see DC-735); Playwright E2E
# and the enrollment-checker job remain genuinely state-specific elsewhere.
# State config can specify Docker or native builds via config files.

name: State CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "deploy/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Detect which areas a PR touches so portal-only changes skip connector/backend
  # jobs and vice versa. Fail-open by design: pushes and manual dispatches always
  # run everything, as does any PR that touches CI or build infrastructure.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      enrollment: ${{ steps.decide.outputs.enrollment }}
      local_root_image: ${{ steps.decide.outputs.local_root_image }}
      keycloak_image: ${{ steps.decide.outputs.keycloak_image }}
    steps:
      - name: Filter changed paths (PRs only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Changes to CI or shared build infrastructure invalidate everything.
            infra:
              - '.github/**'
              - 'scripts/**'
              - '.husky/**'
              - '**/Dockerfile'
              - '.dockerignore'
              - 'compose.yaml'
              - 'package.json'
            backend:
              - 'apps/portal/src/**'
              - '!apps/portal/src/SEBT.Portal.Web/**'
              - '!apps/portal/src/SEBT.EnrollmentChecker.Web/**'
              - 'apps/portal/test/**'
              - 'apps/connectors/**'
              - 'SEBT.slnx'
              - 'global.json'
              - 'nuget.config'
              - 'Directory.Build.props'
              - '.editorconfig'
            frontend:
              - 'apps/portal/src/SEBT.Portal.Web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            enrollment:
              - 'apps/portal/src/SEBT.EnrollmentChecker.Web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # The local-dev images build only when their own inputs change, not on
            # every app change, so the slow combined image stays off most PRs.
            local-root-image:
              - 'Dockerfile'
              - 'compose.yaml'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'scripts/**'
              - '.github/workflows/state-ci.yaml'
            keycloak-image:
              - 'docker/keycloak/**'
              - '.github/workflows/state-ci.yaml'

      - name: Decide which areas run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INFRA: ${{ steps.filter.outputs.infra }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          ENROLLMENT: ${{ steps.filter.outputs.enrollment }}
          LOCAL_ROOT_IMAGE: ${{ steps.filter.outputs.local-root-image }}
          KEYCLOAK_IMAGE: ${{ steps.filter.outputs.keycloak-image }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$INFRA" = "true" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "enrollment=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND:-false}" >> "$GITHUB_OUTPUT"
            echo "enrollment=${ENROLLMENT:-false}" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "local_root_image=true" >> "$GITHUB_OUTPUT"
            echo "keycloak_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "local_root_image=${LOCAL_ROOT_IMAGE:-false}" >> "$GITHUB_OUTPUT"
            echo "keycloak_image=${KEYCLOAK_IMAGE:-false}" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test
    # No job-level `if:` — "Build & Test" is a required check by this exact
    # name; skipping the whole job means it never posts. Gate individual
    # steps below instead.
    needs: [changes]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yq (YAML parser)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Load state configuration
        id: config
        run: |
          # dc/co build config was byte-identical (see DC-735), so this job no
          # longer matrixes per state and reads one shared reference instead.
          # If a state's build ever needs to genuinely diverge, reinstate a
          # matrix here (see the removed discover-states job in git history).
          CONFIG_FILE=".github/config/states/state-config.yaml"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Configuration file not found: $CONFIG_FILE"
            exit 1
          fi

          # Extract configuration values
          echo "use_docker=$(yq eval '.infrastructure.use_docker' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "node_version=$(yq eval '.versions.node' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "pnpm_version=$(yq eval '.versions.pnpm' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "dotnet_version=$(yq eval '.versions.dotnet' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "build_config=$(yq eval '.build.configuration' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "frontend_flags=$(yq eval '.build.frontend_flags' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "backend_flags=$(yq eval '.build.backend_flags' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "skip_tests=$(yq eval '.build.skip_tests' $CONFIG_FILE)" >> $GITHUB_OUTPUT

      - name: Show configuration
        run: |
          echo "Use Docker: ${{ steps.config.outputs.use_docker }}"
          echo "Node: ${{ steps.config.outputs.node_version }}"
          echo "pnpm: ${{ steps.config.outputs.pnpm_version }}"
          echo ".NET: ${{ steps.config.outputs.dotnet_version }}"
          echo "Build Config: ${{ steps.config.outputs.build_config }}"

      # state connector (interfaces) is now in-repo at apps/connectors/state — no checkout needed.

      # Container Build Path (use_docker: true). Runs the build scripts inside a
      # stock image with the repo mounted; it does not test any Dockerfile.
      - name: Build Backend (container, not the Dockerfile)
        if: steps.config.outputs.use_docker == 'true' && needs.changes.outputs.backend == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            mcr.microsoft.com/dotnet/sdk:${{ steps.config.outputs.dotnet_version }} \
            bash -c "./.github/workflows/scripts/build-backend.sh --configuration ${{ steps.config.outputs.build_config }} ${{ steps.config.outputs.backend_flags }}"

      - name: Test Backend (container, not the Dockerfile)
        if: steps.config.outputs.use_docker == 'true' && steps.config.outputs.skip_tests != 'true' && needs.changes.outputs.backend == 'true'
        # Covers the portal suite plus the in-repo connector suites (CO + interfaces).
        timeout-minutes: 10
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e SKIP_SQLSERVER_TESTS=1 \
            mcr.microsoft.com/dotnet/sdk:${{ steps.config.outputs.dotnet_version }} \
            bash -c "./.github/workflows/scripts/test-backend.sh --skip-build --configuration ${{ steps.config.outputs.build_config }} ${{ github.event_name == 'pull_request' && '--coverage' || '' }}"

      - name: Build Frontend (container, not the Dockerfile)
        if: steps.config.outputs.use_docker == 'true' && needs.changes.outputs.frontend == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            node:${{ steps.config.outputs.node_version }}-alpine \
            sh -c "corepack enable && corepack prepare pnpm@${{ steps.config.outputs.pnpm_version }} --activate && sh .github/workflows/scripts/build-frontend.sh --production ${{ steps.config.outputs.frontend_flags }}"

      - name: Test Frontend (container, not the Dockerfile)
        if: steps.config.outputs.use_docker == 'true' && steps.config.outputs.skip_tests != 'true' && needs.changes.outputs.frontend == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            node:${{ steps.config.outputs.node_version }}-alpine \
            sh -c "corepack enable && corepack prepare pnpm@${{ steps.config.outputs.pnpm_version }} --activate && sh .github/workflows/scripts/test-frontend.sh --skip-install ${{ github.event_name == 'pull_request' && '--coverage' || '' }}"

      # Native Build Path
      - name: Setup .NET (Native)
        if: steps.config.outputs.use_docker != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.config.outputs.dotnet_version }}

      - name: Setup pnpm (Native)
        if: steps.config.outputs.use_docker != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.config.outputs.pnpm_version }}

      - name: Setup Node.js (Native)
        if: steps.config.outputs.use_docker != 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.config.outputs.node_version }}
          cache: "pnpm"

      - name: Build Backend (Native)
        if: steps.config.outputs.use_docker != 'true' && needs.changes.outputs.backend == 'true'
        run: ./.github/workflows/scripts/build-backend.sh --configuration ${{ steps.config.outputs.build_config }} ${{ steps.config.outputs.backend_flags }}

      - name: Test Backend (Native)
        if: steps.config.outputs.use_docker != 'true' && steps.config.outputs.skip_tests != 'true' && needs.changes.outputs.backend == 'true'
        # Covers the portal suite plus the in-repo connector suites (CO + interfaces).
        timeout-minutes: 10
        run: ./.github/workflows/scripts/test-backend.sh --skip-build --configuration ${{ steps.config.outputs.build_config }} ${{ github.event_name == 'pull_request' && '--coverage' || '' }}

      - name: Generate Backend Dependencies CSV
        id: generate-backend-dependencies-csv
        if: steps.config.outputs.use_docker != 'true' && needs.changes.outputs.backend == 'true'
        run: ./.github/workflows/scripts/license-audit.sh

      # HTML report for humans browsing the uploaded artifact; the PR comment
      # itself only links to it rather than embedding it. Also emits a merged
      # Cobertura.xml (single file, all 3 test projects' coverage properly
      # unioned): post-coverage-comment.js reads that instead of the raw
      # per-project TestResults/*.xml files, since several assemblies (e.g.
      # SEBT.Portal.StatesPlugins.Interfaces) are exercised by more than one
      # test project, and naively summing raw per-project totals double-counts
      # their lines. ReportGenerator already solves that merge correctly.
      - name: Generate Backend Coverage HTML Report
        if: steps.config.outputs.use_docker != 'true' && github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && steps.config.outputs.skip_tests != 'true'
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:./CoverageReport -reporttypes:"Html;Cobertura"

      - name: Build Frontend (Native)
        if: steps.config.outputs.use_docker != 'true' && needs.changes.outputs.frontend == 'true'
        run: ./.github/workflows/scripts/build-frontend.sh --production ${{ steps.config.outputs.frontend_flags }}

      - name: Test Frontend (Native)
        if: steps.config.outputs.use_docker != 'true' && steps.config.outputs.skip_tests != 'true' && needs.changes.outputs.frontend == 'true'
        run: ./.github/workflows/scripts/test-frontend.sh --skip-install ${{ github.event_name == 'pull_request' && '--coverage' || '' }}

      # Upload artifacts. Connector bin/ dirs are intentionally excluded: the
      # portal consumes connector plugins via the staged plugins-{state}/ dirs
      # under the API project, and those live inside apps/portal/src already.
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            apps/portal/src/SEBT.Portal.Web/.next/standalone
            apps/portal/src/**/bin/${{ steps.config.outputs.build_config }}
            output/backend-dependencies.csv
          retention-days: 7

      # Coverage is PR-only: --coverage above is only passed for
      # pull_request events, so these uploads would find nothing to attach on
      # push/dispatch runs anyway. The explicit event_name check keeps that
      # intent visible here too, rather than relying solely on the flag upstream.
      - name: Upload backend coverage report
        if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && steps.config.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            TestResults/
            CoverageReport/
          retention-days: 7

      - name: Upload frontend coverage report
        if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true' && steps.config.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            apps/portal/src/SEBT.Portal.Web/coverage
            packages/*/coverage
          retention-days: 7

  # Posts a single PR comment summarizing backend + frontend coverage. always()
  # so a failure in build-and-test's tests doesn't also swallow the summary for
  # coverage that was already collected.
  coverage-comment:
    name: Post coverage summary
    needs: build-and-test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download backend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: backend-coverage
          path: coverage-artifacts/backend

      - name: Download frontend coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: frontend-coverage
          path: coverage-artifacts/frontend

      - name: Post coverage summary to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const postCoverageComment = require('./.github/workflows/scripts/post-coverage-comment.js');
            await postCoverageComment({
              github,
              context,
              backendDir: 'coverage-artifacts/backend',
              frontendDir: 'coverage-artifacts/frontend',
              runUrl: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            });

  # deploy-ecr.yaml builds the Web and API images only after merge, so a broken
  # Dockerfile used to surface as a failed deploy to dev. This job builds both
  # images the same way and runs each one, so the break fails the PR instead.
  container-images:
    name: Container images
    # No job-level `if:`, for the same reason as Build & Test: this is meant to
    # be a required check, and a skipped job never posts. Steps are gated instead.
    needs: [changes]
    runs-on: ubuntu-latest
    env:
      RUN_IMAGES: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        if: env.RUN_IMAGES == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        if: env.RUN_IMAGES == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The API image bundles whatever plugins are staged under SEBT.Portal.Api/.
      # Only the in-repo CO plugin is staged, so this job needs no DC connector token.
      - name: Publish and stage CO plugin
        if: env.RUN_IMAGES == 'true'
        run: |
          dotnet publish apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/SEBT.Portal.StatePlugins.CO.csproj \
            -c Release \
            -p:CopyPlugins=false
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-co
          cp apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-co/

      - name: Build API image
        if: env.RUN_IMAGES == 'true'
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg CI=true \
            -f apps/portal/src/SEBT.Portal.Api/Dockerfile \
            -t sebt-portal-api:ci \
            .

      # One build covers every state: STATE is read at runtime, not baked in.
      - name: Build Web image
        if: env.RUN_IMAGES == 'true'
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/portal/src/SEBT.Portal.Web/Dockerfile \
            --build-arg NEXT_PUBLIC_BUILD_SHA=${{ github.sha }} \
            -t sebt-portal-web:ci \
            .

      # /health answers 200 (Degraded) without a database. The secrets are
      # throwaway values that only satisfy startup validation.
      - name: Smoke test API image
        if: env.RUN_IMAGES == 'true'
        run: |
          ./scripts/ci/smoke-test-image.sh \
            --image sebt-portal-api:ci \
            --port 8080 \
            --path /health \
            --env STATE=co \
            --env PluginAssemblyPaths__0=plugins-co \
            --env "IdentifierHasher__SecretKey=$(openssl rand -base64 48)" \
            --env "JwtSettings__SecretKey=$(openssl rand -base64 48)"

      # /login renders without the API, unlike / which only redirects.
      - name: Smoke test Web image
        if: env.RUN_IMAGES == 'true'
        run: |
          ./scripts/ci/smoke-test-image.sh \
            --image sebt-portal-web:ci \
            --port 3000 \
            --path /login \
            --env STATE=co

  # Builds the images used only for local development and the preview Keycloak.
  # Deliberately not a required check: a failure here warns but never blocks a merge.
  local-dev-images:
    name: Local dev images
    needs: [changes]
    if: needs.changes.outputs.local_root_image == 'true' || needs.changes.outputs.keycloak_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build root image (compose.yaml)
        if: needs.changes.outputs.local_root_image == 'true'
        run: |
          if ! docker build -f Dockerfile -t sebt-portal-local:ci .; then
            echo "::warning title=Local dev image::The root Dockerfile used by compose.yaml failed to build."
            exit 1
          fi

      - name: Build Keycloak image
        if: ${{ !cancelled() && needs.changes.outputs.keycloak_image == 'true' }}
        run: |
          if ! docker build --platform linux/amd64 -f docker/keycloak/Dockerfile -t sebt-keycloak:ci docker/keycloak; then
            echo "::warning title=Local dev image::docker/keycloak/Dockerfile failed to build."
            exit 1
          fi

  # The enrollment checker is built only by deploy-enrollment-checker.yaml, which
  # triggers on pushes to main. Without this job, pull requests never lint, build,
  # type-check, or test the app, so its errors only surface after merge.
  # Build steps and tool versions mirror deploy-enrollment-checker.yaml.
  enrollment-checker:
    name: Enrollment Checker - Build & Test
    needs: changes
    if: needs.changes.outputs.enrollment == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build no longer runs ESLint, so lint is its own gate.
      - name: Lint
        run: pnpm --filter @sebt/enrollment-checker lint

      # next build only type-checks files reachable from the app's entry
      # points; tsc --noEmit covers the full tsconfig include set, notably
      # vitest test files.
      - name: Type check
        run: pnpm --filter @sebt/enrollment-checker typecheck

      - name: Test
        run: pnpm ci:test:enrollment-checker

      # "Build & Test" validates both apps whenever the portal or a shared package changes,
      # so this runs only for a change that touches the checker alone.
      - name: Validate locale content
        if: needs.changes.outputs.frontend != 'true'
        run: pnpm --filter @sebt/enrollment-checker copy:validate

      # The static export cannot include SSR-only route handlers; the deploy
      # workflow removes them before building, so do the same here for parity.
      - name: Remove SSR-only API routes
        run: rm -rf apps/portal/src/SEBT.EnrollmentChecker.Web/src/app/api

      # Artwork paths, the locale slice, and the theme all resolve at build time,
      # so one state's build cannot catch another's regression.
      #
      # Sequential steps rather than a job matrix: lint, type check, and test are
      # state-independent, so a matrix would re-run them and the install per
      # state for nothing. The second build overwriting the first is fine — this
      # job only proves each state compiles and publishes no artifacts.
      - name: Build static export (CO)
        run: BUILD_STATIC=true pnpm --filter @sebt/enrollment-checker build
        env:
          STATE: co
          NEXT_PUBLIC_STATE: co
          # Required by the client env schema (src/lib/env.ts). This job only
          # validates that the app builds, so sentinel URLs stand in for the
          # deployment values that deploy-enrollment-checker.yaml provides.
          NEXT_PUBLIC_PORTAL_URL: https://portal.ci-validation.example.gov
          NEXT_PUBLIC_APPLICATION_URL: https://apply.ci-validation.example.gov

      - name: Build static export (DC)
        run: BUILD_STATIC=true pnpm --filter @sebt/enrollment-checker build
        env:
          STATE: dc
          NEXT_PUBLIC_STATE: dc
          NEXT_PUBLIC_PORTAL_URL: https://portal.ci-validation.example.gov
          NEXT_PUBLIC_APPLICATION_URL: https://apply.ci-validation.example.gov

  ci-scripts-test:
    name: CI scripts smoke tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run scripts/ci/tests/run-all.sh
        run: bash scripts/ci/tests/run-all.sh

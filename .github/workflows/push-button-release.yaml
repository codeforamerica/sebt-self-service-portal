name: Push-Button Release

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'Which state to cut a formal release for. Dispatch this against main — the release tag is created at end_sha if set, otherwise at whatever ref this workflow runs on.'
        required: true
        type: choice
        options:
          - dc
          - co
      start_sha:
        description: 'Optional: manually specify the starting commit SHA for the portal range, instead of auto-resolving it from the live /api/build-info endpoint. Use this when that endpoint is unreachable (e.g. blocked by state WAF/network rules). Leave blank to auto-resolve.'
        required: false
        type: string
      end_sha:
        description: 'Optional: commit SHA to end the portal range at. Leave blank to use the latest commit on main.'
        required: false
        type: string
      connector_start_sha:
        description: '(DC only) Optional: manually specify the starting commit SHA for the dc-connector range, instead of auto-resolving it from the live endpoint. Ignored (must be blank) when state is not dc.'
        required: false
        type: string
      connector_end_sha:
        description: '(DC only) Optional: commit SHA to end the dc-connector range at, instead of auto-resolving the branch/main ref. Ignored (must be blank) when state is not dc.'
        required: false
        type: string
      include_chores:
        description: 'Include Chores in this release (normally excluded)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # actions/checkout's ref: only accepts a branch/tag name or a FULL 40-char
      # SHA, unlike git itself it won't resolve an abbreviated SHA. Resolve via
      # the GitHub API first (which does accept abbreviated SHAs) so end_sha can
      # be given in either form, same as start_sha already can.
      - name: Resolve end_sha
        id: end-sha
        if: inputs.end_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          END_SHA: ${{ inputs.end_sha }}
        run: |
          FULL="$(gh api "repos/${REPO}/commits/${END_SHA}" --jq .sha)" || {
            echo "::error::end_sha '${END_SHA}' could not be resolved via the GitHub API"
            exit 1
          }
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"

      - name: Checkout portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.end-sha.outputs.sha || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve prod URL for state
        id: prod-url
        env:
          STATE: ${{ inputs.state }}
        run: |
          case "$STATE" in
            dc) echo "url=https://portal.sunbucks.dc.gov" >> "$GITHUB_OUTPUT" ;;
            co) echo "url=https://sebt.cbms.cdhs.state.co.us" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown state: $STATE"; exit 1 ;;
          esac

      - name: Validate connector SHA overrides are DC-only
        if: inputs.state != 'dc' && (inputs.connector_start_sha != '' || inputs.connector_end_sha != '')
        run: |
          echo "::error::connector_start_sha/connector_end_sha only apply when state=dc — leave them blank for a co release."
          exit 1

      # The release tag is date + state based (YYYY.MM.DD-dc/-colorado), so two
      # runs for the same state on the same day would otherwise collide. A
      # collision with an existing DRAFT is fine — action-gh-release just
      # updates it in place, which is what lets you iterate on a range before
      # publishing. A collision with an already-PUBLISHED release is not fine:
      # the same update-in-place behavior would silently rewrite a release a
      # state partner may have already seen. So only escalate to the next
      # available suffix (-2, -3, ...) when the existing release is published.
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ inputs.state }}
          REPO: ${{ github.repository }}
        run: |
          case "$STATE" in
            dc) SUFFIX="dc"; STATE_NAME="DC" ;;
            co) SUFFIX="colorado"; STATE_NAME="Colorado" ;;
          esac
          DATE="$(date +%Y.%m.%d)"
          BASE="${DATE}-${SUFFIX}"
          TAG="$BASE"
          N=1
          while EXISTING="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>/dev/null)"; do
            if [ "$(echo "$EXISTING" | jq -r '.draft')" = "true" ]; then
              echo "A draft release already exists for tag ${TAG} and will be updated in place."
              break
            fi
            N=$((N + 1))
            TAG="${BASE}-${N}"
          done
          echo "Using tag ${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "state_name=$STATE_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve live portal SHA
        id: old-portal-sha
        if: inputs.start_sha == ''
        run: |
          SHA="$(./scripts/release-notes/resolve-live-sha.sh --url "${{ steps.prod-url.outputs.url }}" --field buildSha)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # ─── DC connector resolution (DC only) ──────────────────────────────────────
      # Same ref-resolution logic as release-iis-dc.yaml/deploy-ecr.yaml: paired
      # contract changes need the dc-connector branch of the same name, everything
      # else falls back to main. Resolves to a commit SHA so the checkout is pinned.
      - name: Get dc-connector access token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: dc-connector-token
        if: inputs.state == 'dc'
        with:
          app-id: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_PRIVATE_KEY }}
          owner: codeforamerica
          repositories: sebt-self-service-portal-dc-connector

      - name: Determine dc-connector ref
        id: dc-connector-ref
        if: inputs.state == 'dc' && inputs.connector_end_sha == ''
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONNECTOR_TOKEN: ${{ steps.dc-connector-token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid git ref: branch=$BRANCH"
            exit 1
          fi
          if [ -z "$CONNECTOR_TOKEN" ]; then
            echo "::error::dc-connector app token is empty — check the create-github-app-token step above"
            exit 1
          fi
          # Authenticate exactly the way actions/checkout does (basic auth header) —
          # URL-embedded credentials are rejected for this token and would also leak
          # into error output.
          AUTH_HEADER="AUTHORIZATION: basic $(printf '%s' "x-access-token:${CONNECTOR_TOKEN}" | base64 | tr -d '\n')"
          REPO_URL="https://github.com/${REPO_OWNER}/sebt-self-service-portal-dc-connector.git"
          # Run outside the portal checkout: its persisted GITHUB_TOKEN auth header
          # would override ours and 404 on the private connector repo.
          if ! LS_OUT=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/${BRANCH}" 2>&1); then
            echo "::error::dc-connector ls-remote failed: ${LS_OUT}"
            exit 1
          fi
          RESOLVED="$BRANCH"
          SHA=$(printf '%s\n' "$LS_OUT" | cut -f1 | head -1)
          if [ -z "$SHA" ]; then
            RESOLVED="main"
            SHA=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/main" | cut -f1 | head -1)
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve dc-connector ${RESOLVED} to a commit SHA"
            exit 1
          fi
          echo "Resolved dc-connector ${RESOLVED} -> ${SHA}"
          echo "ref=${SHA}" >> "$GITHUB_OUTPUT"

      # Same abbreviated-SHA limitation as Resolve end_sha above, resolved the
      # same way — dc-connector is private, so this needs the App token rather
      # than the default GITHUB_TOKEN.
      - name: Resolve connector_end_sha
        id: connector-end-sha
        if: inputs.state == 'dc' && inputs.connector_end_sha != ''
        env:
          GH_TOKEN: ${{ steps.dc-connector-token.outputs.token }}
          CONNECTOR_END_SHA: ${{ inputs.connector_end_sha }}
        run: |
          FULL="$(gh api "repos/codeforamerica/sebt-self-service-portal-dc-connector/commits/${CONNECTOR_END_SHA}" --jq .sha)" || {
            echo "::error::connector_end_sha '${CONNECTOR_END_SHA}' could not be resolved via the GitHub API"
            exit 1
          }
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"

      - name: Checkout dc-connector
        if: inputs.state == 'dc'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: codeforamerica/sebt-self-service-portal-dc-connector
          token: ${{ steps.dc-connector-token.outputs.token }}
          ref: ${{ steps.connector-end-sha.outputs.sha || steps.dc-connector-ref.outputs.ref }}
          path: dc-connector
          fetch-depth: 0

      - name: Resolve live dc-connector SHA
        id: old-connector-sha
        if: inputs.state == 'dc' && inputs.connector_start_sha == ''
        run: |
          SHA="$(./scripts/release-notes/resolve-live-sha.sh --url "${{ steps.prod-url.outputs.url }}" --field dcConnectorSha --git-dir dc-connector)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # ─── Generate release notes ──────────────────────────────────────────────────
      # generate.ts always writes to output/YYYY-MM-DD.md, so the portal call's
      # output has to be moved aside before the connector call (same date) overwrites it.
      - name: Generate portal release notes
        run: |
          npx --yes tsx@4 scripts/release-notes/generate.ts \
            --since-sha="$SINCE_SHA" \
            --state-filter="$STATE_FILTER" \
            --include-chores="$INCLUDE_CHORES"
          mv "scripts/release-notes/output/$(date +%Y-%m-%d).md" "$RUNNER_TEMP/portal-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE_SHA: ${{ inputs.start_sha || steps.old-portal-sha.outputs.sha }}
          STATE_FILTER: ${{ inputs.state }}
          INCLUDE_CHORES: ${{ inputs.include_chores }}

      - name: Generate dc-connector release notes
        if: inputs.state == 'dc'
        run: |
          # --state-filter=dc excludes Chores here the same as it does for the portal
          # section above (unless include_chores opted back in). Chore exclusion only
          # works if dc-connector's own PRs carry a chore-matching label
          # (chore/dependabot/etc) rather than just GitHub's native
          # dependencies/github_actions labels — requires that repo to have its own
          # branch-prefix labeler mirroring .github/labeler.yml.
          npx --yes tsx@4 scripts/release-notes/generate.ts \
            --repo=codeforamerica/sebt-self-service-portal-dc-connector \
            --git-dir=dc-connector \
            --since-sha="$SINCE_SHA" \
            --state-filter=dc \
            --include-chores="$INCLUDE_CHORES"
          mv "scripts/release-notes/output/$(date +%Y-%m-%d).md" "$RUNNER_TEMP/connector-notes.md"
        env:
          GH_TOKEN: ${{ steps.dc-connector-token.outputs.token }}
          SINCE_SHA: ${{ inputs.connector_start_sha || steps.old-connector-sha.outputs.sha }}
          INCLUDE_CHORES: ${{ inputs.include_chores }}

      # ─── Compose and publish ─────────────────────────────────────────────────────
      - name: Compose release body
        id: compose
        env:
          STATE: ${{ inputs.state }}
        run: |
          {
            echo "## Summary"
            echo ""
            echo "_Fill in a plain-language summary before publishing — the lists below are the raw material, not the final thing the state partner sees._"
            echo ""
            tail -n +2 "$RUNNER_TEMP/portal-notes.md"
            if [ "$STATE" = "dc" ]; then
              echo ""
              echo "## Changes in dc-connector"
              # Connector PRs never carry a dc label and CO is always excluded, so
              # "Portal Wide Changes" (a meaningless label for a single, entirely-DC
              # repo) is the only header besides Chores (shown only if include_chores
              # opted in) that can appear here — strip Portal Wide Changes so it
              # doesn't appear as a redundant nested heading. Left untouched if this
              # run had zero connector PRs (that message doesn't match the pattern).
              tail -n +2 "$RUNNER_TEMP/connector-notes.md" \
                | sed '/^## Portal Wide Changes$/d' \
                | sed 's/\*\*Full Changelog\*\*:/**Full Changelog (dc-connector)**:/'
            fi
          } > "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.date }} ${{ steps.tag.outputs.state_name }} Release"
          body_path: ${{ runner.temp }}/release-body.md
          target_commitish: ${{ steps.end-sha.outputs.sha || github.sha }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

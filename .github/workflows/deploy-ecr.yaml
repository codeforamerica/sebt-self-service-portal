name: Deploy (ECR)

on:
  push:
    inputs:
      state:
        description: "State to deploy (e.g. dc, co)"
        required: true
        type: string
      stage:
        description: "Environment/stage (e.g. dev, staging, prod)"
        required: true
        default: "dev"
        type: string
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"
        type: string
      image_tag:
        description: "Image tag to push/deploy (default: git sha)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      state:
        description: "State to deploy (e.g. dc, co)"
        required: true
        type: string
      stage:
        description: "Environment/stage (e.g. dev, staging, prod)"
        required: true
        default: "dev"
        type: string
      aws_region:
        description: "AWS region"
        required: true
        default: "us-east-1"
        type: string
      image_tag:
        description: "Image tag to push/deploy (default: git sha)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}-${{ inputs.state || 'dc' }}
  cancel-in-progress: false

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      run_apply: ${{ steps.meta.outputs.run_apply }}

    env:
      AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
      STAGE: ${{ inputs.stage || 'dev' }}
      STATE: ${{ inputs.state || 'dc' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set apply flag
        id: meta
        run: |
          echo "run_apply=$([ \"$ACT\" = 'true' ] && echo 'false' || echo 'true')" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.ACT != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.ACT != 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repository URLs
        id: ecr
        run: |
          if [ "$ACT" = "true" ]; then
            echo "api_repo=sebt-portal-api" >> "$GITHUB_OUTPUT"
            echo "web_repo=sebt-portal-web" >> "$GITHUB_OUTPUT"
          else
            if [ -z "${{ secrets.ECR_API_REPOSITORY_URL }}" ] || [ -z "${{ secrets.ECR_WEB_REPOSITORY_URL }}" ]; then
              echo "Missing secrets ECR_API_REPOSITORY_URL and/or ECR_WEB_REPOSITORY_URL" >&2
              exit 1
            fi
            echo "api_repo=${{ secrets.ECR_API_REPOSITORY_URL }}" >> "$GITHUB_OUTPUT"
            echo "web_repo=${{ secrets.ECR_WEB_REPOSITORY_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push API image
        run: |
          docker build \
            --platform linux/amd64 \
            -f src/SEBT.Portal.Api/Dockerfile \
            -t "${{ steps.ecr.outputs.api_repo }}:${{ steps.tag.outputs.tag }}" \
            .
          if [ "$ACT" != "true" ]; then
            docker push "${{ steps.ecr.outputs.api_repo }}:${{ steps.tag.outputs.tag }}"
          fi

      - name: Build + push Web image
        run: |
          docker build \
            --platform linux/amd64 \
            -f src/SEBT.Portal.Web/Dockerfile \
            --build-arg STATE="${STATE}" \
            -t "${{ steps.ecr.outputs.web_repo }}:${{ steps.tag.outputs.tag }}" \
            .
          if [ "$ACT" != "true" ]; then
            docker push "${{ steps.ecr.outputs.web_repo }}:${{ steps.tag.outputs.tag }}"
          fi

  apply-infra:
    needs: build-push-and-deploy
    if: needs.build-push-and-deploy.outputs.run_apply == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
      STAGE: ${{ inputs.stage || 'dev' }}
      STATE: ${{ inputs.state || 'dc' }}
      APP_NAME: ${{ vars.ECS_APP_NAME || 'sebt-portal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - name: OpenTofu Init (app)
        working-directory: tofu/app
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="key=sebt-self-service-portal/${STAGE}/${STATE}.tfstate" \
            -backend-config="dynamodb_table=${{ secrets.TFSTATE_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: OpenTofu Apply (app)
        working-directory: tofu/app
        run: |
          tofu apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="name=${{ env.APP_NAME }}" \
            -var="stage=${{ env.STAGE }}" \
            -var="state=${{ env.STATE }}" \
            -var="image_tag=${{ needs.build-push-and-deploy.outputs.image_tag }}"

name: Deploy (ECR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push/deploy (default: git sha)"
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # In PRs plan only if tofu files changed
  check-infra-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.tofu }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for tofu changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tofu:
              - 'tofu/**'

  plan-dc-shared:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-dc
      config: dev-dc-shared
    secrets: inherit

  plan-dc:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-dc
      config: dev-dc
      image_tag: ${{ github.sha }}
    secrets: inherit
  
  plan-co-shared:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-co
      config: dev-co-shared
    secrets: inherit

  plan-co:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-co
      config: dev-co
      image_tag: ${{ github.sha }}
    secrets: inherit

  # Off until the repository variable DEMO_ENABLED is 'true': the dev-demo
  # GitHub environment, Doppler config and DNS zone are set up by hand first.
  plan-demo:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true' && vars.DEMO_ENABLED == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-demo
      config: dev-demo
      image_tag: ${{ github.sha }}
    secrets: inherit

  plan-comment:
    needs: [plan-dc-shared, plan-dc, plan-co-shared, plan-co, plan-demo]
    if: always() && (needs.plan-dc-shared.outputs.plan || needs.plan-dc.outputs.plan || needs.plan-co-shared.outputs.plan || needs.plan-co.outputs.plan || needs.plan-demo.outputs.plan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Post plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DC_SHARED_PLAN: ${{ needs.plan-dc-shared.outputs.plan }}
          DC_PLAN: ${{ needs.plan-dc.outputs.plan }}
          CO_SHARED_PLAN: ${{ needs.plan-co-shared.outputs.plan }}
          CO_PLAN: ${{ needs.plan-co.outputs.plan }}
          DEMO_PLAN: ${{ needs.plan-demo.outputs.plan }}
        with:
          script: |
            const postPlanComment = require('./.github/workflows/scripts/post-plan-comment.js');
            await postPlanComment({ github, context });

  # Build and deploy only on push to main or manual trigger, not on PRs
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      dc_connector_sha: ${{ steps.dc-connector-ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tag
        id: tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            if [[ ! "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid image tag: $INPUT_IMAGE_TAG"
              exit 1
            fi
            echo "tag=${INPUT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Get dc-connector access token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: dc-connector-token
        with:
          app-id: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_PRIVATE_KEY }}
          owner: codeforamerica
          repositories: sebt-self-service-portal-dc-connector

      # state + co connectors are now in-repo (apps/connectors/*); only dc remains external.
      # Same branch-matching as release-iis-dc.yaml: paired contract changes need the
      # dc-connector branch of the same name; everything else falls back to main. The
      # matched branch resolves to a commit SHA so the checkout is pinned — no window
      # for the branch to move between resolution and checkout.
      - name: Determine dc-connector ref
        id: dc-connector-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONNECTOR_TOKEN: ${{ steps.dc-connector-token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid git ref: branch=$BRANCH"
            exit 1
          fi
          if [ -z "$CONNECTOR_TOKEN" ]; then
            echo "::error::dc-connector app token is empty — check the create-github-app-token step above"
            exit 1
          fi
          # Authenticate exactly the way actions/checkout does (basic auth header) —
          # URL-embedded credentials are rejected for this token and would also leak
          # into error output.
          AUTH_HEADER="AUTHORIZATION: basic $(printf '%s' "x-access-token:${CONNECTOR_TOKEN}" | base64 | tr -d '\n')"
          REPO_URL="https://github.com/${REPO_OWNER}/sebt-self-service-portal-dc-connector.git"
          # Without --exit-code, ls-remote fails only on auth/connection problems;
          # an absent branch is just empty output. Auth failures must fail the job —
          # a silent fallback to main masks them as baffling downstream build errors.
          # Run outside the portal checkout: its persisted GITHUB_TOKEN auth header
          # (actions/checkout persist-credentials) would override ours and 404 on
          # the private connector repo.
          if ! LS_OUT=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/${BRANCH}" 2>&1); then
            echo "::error::dc-connector ls-remote failed: ${LS_OUT}"
            exit 1
          fi
          RESOLVED="$BRANCH"
          SHA=$(printf '%s\n' "$LS_OUT" | cut -f1 | head -1)
          if [ -z "$SHA" ]; then
            RESOLVED="main"
            SHA=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/main" | cut -f1 | head -1)
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve dc-connector ${RESOLVED} to a commit SHA"
            exit 1
          fi
          echo "Resolved dc-connector ${RESOLVED} -> ${SHA}"
          echo "ref=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout dc-connector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: codeforamerica/sebt-self-service-portal-dc-connector
          token: ${{ steps.dc-connector-token.outputs.token }}
          ref: ${{ steps.dc-connector-ref.outputs.ref }}
          path: dc-connector

      - name: Build plugin interfaces (NuGet package)
        run: |
          dotnet build apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj \
            -c Release

      - name: Publish DC plugin
        run: |
          # dc-connector has no committed lockfile (deliberate — see the locked-mode ADR);
          # exempt this out-of-tree restore so CI locked mode doesn't fail it.
          dotnet publish dc-connector/src/SEBT.Portal.StatePlugins.DC/SEBT.Portal.StatePlugins.DC.csproj \
            -c Release \
            -p:CopyPlugins=false \
            -p:RestoreLockedMode=false \
            -p:StateConnectorInterfacesProject="$GITHUB_WORKSPACE/apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj"

      - name: Publish CO plugin
        run: |
          dotnet publish apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/SEBT.Portal.StatePlugins.CO.csproj \
            -c Release \
            -p:CopyPlugins=false

      - name: Stage plugin artifacts for Docker build
        run: |
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-dc
          cp dc-connector/src/SEBT.Portal.StatePlugins.DC/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-dc/
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-co
          cp apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-co/

      - name: Build API image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg CI=true \
            -f apps/portal/src/SEBT.Portal.Api/Dockerfile \
            -t sebt-portal-api:${{ steps.tag.outputs.tag }} \
            .

      - name: Save Docker images
        run: |
          docker save \
            sebt-portal-api:${{ steps.tag.outputs.tag }} \
            -o /tmp/docker-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-images
          path: /tmp/docker-images.tar
          retention-days: 1

  # The network, logging, bastion and RDS instance shared by the deployments in
  # the DC account. Applies before the configs that look them up.
  deploy-dc-shared:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-config.yaml
    with:
      environment: dev-dc
      config: dev-dc-shared
    secrets: inherit

  publish-dc:
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/publish-images.yaml
    with:
      environment: dev-dc
      image_tag: ${{ needs.build.outputs.image_tag }}
      dc_connector_sha: ${{ needs.build.outputs.dc_connector_sha }}
    secrets: inherit

  deploy-dc:
    if: github.event_name != 'pull_request'
    needs: [build, publish-dc, deploy-dc-shared]
    uses: ./.github/workflows/deploy-config.yaml
    with:
      environment: dev-dc
      config: dev-dc
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  # The network, logging, bastion, RDS instance and Keycloak shared by the
  # deployments in the CO account. Applies before the configs that look them up.
  deploy-co-shared:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-config.yaml
    with:
      environment: dev-co
      config: dev-co-shared
    secrets: inherit

  publish-co:
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/publish-images.yaml
    with:
      environment: dev-co
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  deploy-co:
    if: github.event_name != 'pull_request'
    needs: [build, publish-co, deploy-co-shared]
    uses: ./.github/workflows/deploy-config.yaml
    with:
      environment: dev-co
      config: dev-co
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  # The unbranded demo. Deploys the images publish-co pushed to the CO account's
  # ECR repositories, so it runs after deploy-co.
  deploy-demo:
    if: github.event_name != 'pull_request' && vars.DEMO_ENABLED == 'true'
    needs: [build, publish-co, deploy-co]
    uses: ./.github/workflows/deploy-config.yaml
    with:
      environment: dev-demo
      config: dev-demo
      image_tag: ${{ needs.build.outputs.image_tag }}
      register_keycloak_host: true
    secrets: inherit

  create-deployment-record:
    needs: [deploy-dc, deploy-co, deploy-demo]
    if: always() && (needs.deploy-dc.result == 'success' || needs.deploy-co.result == 'success' || needs.deploy-demo.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Create GitHub deployments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_JOBS: ${{ toJSON(needs) }}
        with:
          script: |
            const environmentByJob = {
              'deploy-dc': 'dev-dc',
              'deploy-co': 'dev-co',
              'deploy-demo': 'dev-demo',
            };
            const jobs = JSON.parse(process.env.DEPLOY_JOBS);
            const ref = context.sha;

            for (const [job, environment] of Object.entries(environmentByJob)) {
              if (jobs[job]?.result !== 'success') {
                continue;
              }

              const rawUrl = jobs[job].outputs?.web_url ?? '';
              const webUrl = rawUrl && !rawUrl.startsWith('http') ? `https://${rawUrl}` : rawUrl;

              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                environment,
                auto_merge: false,
                required_contexts: [],
                description: `Deploy ${environment} (${ref.slice(0, 7)})`
              });

              const deploymentId = deployment.data.id;
              if (deploymentId) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deploymentId,
                  state: 'success',
                  environment_url: webUrl || undefined,
                  description: 'Deployment finished successfully'
                });
              }
            }

name: Deploy (ECR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push/deploy (default: git sha)"
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # In PRs plan only if tofu files changed
  check-infra-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.tofu }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for tofu changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tofu:
              - 'tofu/**'

  plan-dc:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-dc
      config: dev-dc
      image_tag: ${{ github.sha }}
    secrets: inherit
  
  plan-co:
    needs: check-infra-changes
    if: needs.check-infra-changes.outputs.changed == 'true'
    uses: ./.github/workflows/plan.yaml
    with:
      environment: dev-co
      config: dev-co
      image_tag: ${{ github.sha }}
    secrets: inherit

  plan-comment:
    needs: [plan-dc, plan-co]
    if: always() && (needs.plan-dc.outputs.plan || needs.plan-co.outputs.plan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Post plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DC_PLAN: ${{ needs.plan-dc.outputs.plan }}
          CO_PLAN: ${{ needs.plan-co.outputs.plan }}
        with:
          script: |
            const postPlanComment = require('./.github/workflows/scripts/post-plan-comment.js');
            await postPlanComment({ github, context });

  # Build and deploy only on push to main or manual trigger, not on PRs
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      dc_connector_sha: ${{ steps.dc-connector-ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tag
        id: tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            if [[ ! "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid image tag: $INPUT_IMAGE_TAG"
              exit 1
            fi
            echo "tag=${INPUT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Get dc-connector access token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: dc-connector-token
        with:
          app-id: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_ID }}
          private-key: ${{ secrets.DC_CONNECTOR_CHECKOUT_APP_PRIVATE_KEY }}
          owner: codeforamerica
          repositories: sebt-self-service-portal-dc-connector

      # state + co connectors are now in-repo (apps/connectors/*); only dc remains external.
      # Same branch-matching as release-iis-dc.yaml: paired contract changes need the
      # dc-connector branch of the same name; everything else falls back to main. The
      # matched branch resolves to a commit SHA so the checkout is pinned — no window
      # for the branch to move between resolution and checkout.
      - name: Determine dc-connector ref
        id: dc-connector-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CONNECTOR_TOKEN: ${{ steps.dc-connector-token.outputs.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid git ref: branch=$BRANCH"
            exit 1
          fi
          if [ -z "$CONNECTOR_TOKEN" ]; then
            echo "::error::dc-connector app token is empty — check the create-github-app-token step above"
            exit 1
          fi
          # Authenticate exactly the way actions/checkout does (basic auth header) —
          # URL-embedded credentials are rejected for this token and would also leak
          # into error output.
          AUTH_HEADER="AUTHORIZATION: basic $(printf '%s' "x-access-token:${CONNECTOR_TOKEN}" | base64 | tr -d '\n')"
          REPO_URL="https://github.com/${REPO_OWNER}/sebt-self-service-portal-dc-connector.git"
          # Without --exit-code, ls-remote fails only on auth/connection problems;
          # an absent branch is just empty output. Auth failures must fail the job —
          # a silent fallback to main masks them as baffling downstream build errors.
          # Run outside the portal checkout: its persisted GITHUB_TOKEN auth header
          # (actions/checkout persist-credentials) would override ours and 404 on
          # the private connector repo.
          if ! LS_OUT=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/${BRANCH}" 2>&1); then
            echo "::error::dc-connector ls-remote failed: ${LS_OUT}"
            exit 1
          fi
          RESOLVED="$BRANCH"
          SHA=$(printf '%s\n' "$LS_OUT" | cut -f1 | head -1)
          if [ -z "$SHA" ]; then
            RESOLVED="main"
            SHA=$(cd "$RUNNER_TEMP" && git -c http.extraheader="$AUTH_HEADER" ls-remote "$REPO_URL" "refs/heads/main" | cut -f1 | head -1)
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve dc-connector ${RESOLVED} to a commit SHA"
            exit 1
          fi
          echo "Resolved dc-connector ${RESOLVED} -> ${SHA}"
          echo "ref=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout dc-connector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: codeforamerica/sebt-self-service-portal-dc-connector
          token: ${{ steps.dc-connector-token.outputs.token }}
          ref: ${{ steps.dc-connector-ref.outputs.ref }}
          path: dc-connector

      - name: Build plugin interfaces (NuGet package)
        run: |
          dotnet build apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj \
            -c Release

      - name: Publish DC plugin
        run: |
          dotnet publish dc-connector/src/SEBT.Portal.StatePlugins.DC/SEBT.Portal.StatePlugins.DC.csproj \
            -c Release \
            -p:CopyPlugins=false \
            -p:StateConnectorInterfacesProject="$GITHUB_WORKSPACE/apps/connectors/state/src/SEBT.Portal.StatesPlugins.Interfaces/SEBT.Portal.StatesPlugins.Interfaces.csproj"

      - name: Publish CO plugin
        run: |
          dotnet publish apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/SEBT.Portal.StatePlugins.CO.csproj \
            -c Release \
            -p:CopyPlugins=false

      - name: Stage plugin artifacts for Docker build
        run: |
          mkdir -p nuget-store
          cp -r ~/nuget-store/* nuget-store/
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-dc
          cp dc-connector/src/SEBT.Portal.StatePlugins.DC/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-dc/
          mkdir -p apps/portal/src/SEBT.Portal.Api/plugins-co
          cp apps/connectors/co/src/SEBT.Portal.StatePlugins.CO/bin/Release/net10.0/publish/*.dll \
            apps/portal/src/SEBT.Portal.Api/plugins-co/

      - name: Build API image
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/portal/src/SEBT.Portal.Api/Dockerfile \
            -t sebt-portal-api:${{ steps.tag.outputs.tag }} \
            .

      - name: Save Docker images
        run: |
          docker save \
            sebt-portal-api:${{ steps.tag.outputs.tag }} \
            -o /tmp/docker-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-images
          path: /tmp/docker-images.tar
          retention-days: 1

  deploy-dc:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: dev-dc
    outputs:
      web_url: ${{ steps.deploy-url.outputs.url }}
    env:
      AWS_REGION: us-east-1
      DOPPLER_OIDC_IDENTITY: ${{ secrets.DOPPLER_OIDC_IDENTITY }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_private_subnets: ${{ vars.PRIVATE_SUBNETS }}
      TF_VAR_public_subnets: ${{ vars.PUBLIC_SUBNETS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load -i /tmp/docker-images.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build Web image
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/portal/src/SEBT.Portal.Web/Dockerfile \
            --build-arg STATE=dc \
            --build-arg NEXT_PUBLIC_SOCURE_SDK_KEY=${{ vars.SOCURE_SDK_KEY }} \
            --build-arg NEXT_PUBLIC_SOCURE_DI_SDK_KEY=${{ vars.SOCURE_DI_SDK_KEY }} \
            --build-arg NEXT_PUBLIC_MOCK_SOCURE=${{ vars.MOCK_SOCURE }} \
            --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.AMPLITUDE_API_KEY }} \
            --build-arg NEXT_PUBLIC_MIXPANEL_TOKEN=${{ vars.MIXPANEL_TOKEN }} \
            --build-arg NEXT_PUBLIC_SITEIMPROVE_ID=${{ vars.SITEIMPROVE_ID }} \
            --build-arg NEXT_PUBLIC_SMARTY_EMBEDDED_KEY=${{ vars.SMARTY_EMBEDDED_KEY }} \
            --build-arg NEXT_PUBLIC_BUILD_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_DC_CONNECTOR_SHA=${{ needs.build.outputs.dc_connector_sha }} \
            -t sebt-portal-web-dc:${{ needs.build.outputs.image_tag }} \
            .

      - name: Push images to ECR
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          API_REPO="${{ secrets.ECR_API_REPOSITORY_URL }}"
          WEB_REPO="${{ secrets.ECR_WEB_REPOSITORY_URL }}"

          docker tag sebt-portal-api:${IMAGE_TAG} ${API_REPO}:${IMAGE_TAG}
          docker tag sebt-portal-web-dc:${IMAGE_TAG} ${WEB_REPO}:${IMAGE_TAG}

          docker push ${API_REPO}:${IMAGE_TAG}
          docker push ${WEB_REPO}:${IMAGE_TAG}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install DB rotation Lambda dependencies
        run: ./.github/workflows/scripts/install-rotation-lambda-deps.sh

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10.0"

      - name: OpenTofu Init
        working-directory: tofu/config/dev-dc
        run: tofu init -upgrade

      # Doppler OIDC tokens are single-use. Plan and apply each need their own
      # provider authentication, so each gets its own freshly-fetched token —
      # reusing one token for both fails with "This OIDC token was used
      # previously".
      - name: Get an OIDC token for Doppler (plan)
        run: |
          DOPPLER_OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/$GITHUB_REPOSITORY_OWNER" | jq -r '.value')
          echo "DOPPLER_OIDC_TOKEN=$DOPPLER_OIDC_TOKEN" >> $GITHUB_ENV

      - name: OpenTofu Plan
        working-directory: tofu/config/dev-dc
        run: |
          tofu plan -input=false -out=tfplan \
            -var="image_tag=${{ needs.build.outputs.image_tag }}"

      - name: Get an OIDC token for Doppler (apply)
        run: |
          DOPPLER_OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/$GITHUB_REPOSITORY_OWNER" | jq -r '.value')
          echo "DOPPLER_OIDC_TOKEN=$DOPPLER_OIDC_TOKEN" >> $GITHUB_ENV

      - name: OpenTofu Apply
        working-directory: tofu/config/dev-dc
        run: tofu apply tfplan

      - name: Get deployment URL
        id: deploy-url
        working-directory: tofu/config/dev-dc
        run: |
          WEB_URL=$(tofu output -raw web_endpoint_url 2>/dev/null || echo "")
          echo "url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $WEB_URL"

  deploy-co:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: dev-co
    outputs:
      web_url: ${{ steps.deploy-url.outputs.url }}
    env:
      AWS_REGION: us-east-1
      DOPPLER_OIDC_IDENTITY: ${{ secrets.DOPPLER_OIDC_IDENTITY }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_private_subnets: ${{ vars.PRIVATE_SUBNETS }}
      TF_VAR_public_subnets: ${{ vars.PUBLIC_SUBNETS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load -i /tmp/docker-images.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build Web image
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/portal/src/SEBT.Portal.Web/Dockerfile \
            --build-arg STATE=co \
            --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.AMPLITUDE_API_KEY }} \
            --build-arg NEXT_PUBLIC_MIXPANEL_TOKEN=${{ vars.MIXPANEL_TOKEN }} \
            --build-arg NEXT_PUBLIC_SITEIMPROVE_ID=${{ vars.SITEIMPROVE_ID }} \
            --build-arg NEXT_PUBLIC_SMARTY_EMBEDDED_KEY=${{ vars.SMARTY_EMBEDDED_KEY }} \
            --build-arg NEXT_PUBLIC_BUILD_SHA=${{ github.sha }} \
            -t sebt-portal-web-co:${{ needs.build.outputs.image_tag }} \
            .

      - name: Push images to ECR
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          API_REPO="${{ secrets.ECR_API_REPOSITORY_URL }}"
          WEB_REPO="${{ secrets.ECR_WEB_REPOSITORY_URL }}"

          docker tag sebt-portal-api:${IMAGE_TAG} ${API_REPO}:${IMAGE_TAG}
          docker tag sebt-portal-web-co:${IMAGE_TAG} ${WEB_REPO}:${IMAGE_TAG}

          docker push ${API_REPO}:${IMAGE_TAG}
          docker push ${WEB_REPO}:${IMAGE_TAG}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install DB rotation Lambda dependencies
        run: ./.github/workflows/scripts/install-rotation-lambda-deps.sh

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10.0"

      - name: OpenTofu Init
        working-directory: tofu/config/dev-co
        run: tofu init -upgrade

      # Doppler OIDC tokens are single-use. Plan and apply each need their own
      # provider authentication, so each gets its own freshly-fetched token —
      # reusing one token for both fails with "This OIDC token was used
      # previously".
      - name: Get an OIDC token for Doppler (plan)
        run: |
          DOPPLER_OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/$GITHUB_REPOSITORY_OWNER" | jq -r '.value')
          echo "DOPPLER_OIDC_TOKEN=$DOPPLER_OIDC_TOKEN" >> $GITHUB_ENV

      - name: OpenTofu Plan
        working-directory: tofu/config/dev-co
        run: |
          tofu plan -input=false -out=tfplan \
            -var="image_tag=${{ needs.build.outputs.image_tag }}"

      - name: Get an OIDC token for Doppler (apply)
        run: |
          DOPPLER_OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/$GITHUB_REPOSITORY_OWNER" | jq -r '.value')
          echo "DOPPLER_OIDC_TOKEN=$DOPPLER_OIDC_TOKEN" >> $GITHUB_ENV

      - name: OpenTofu Apply
        working-directory: tofu/config/dev-co
        run: tofu apply tfplan

      - name: Get deployment URL
        id: deploy-url
        working-directory: tofu/config/dev-co
        run: |
          WEB_URL=$(tofu output -raw web_endpoint_url 2>/dev/null || echo "")
          echo "url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $WEB_URL"

  create-deployment-record:
    needs: [deploy-dc, deploy-co]
    if: always() && (needs.deploy-dc.result == 'success' || needs.deploy-co.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Create GitHub deployment for DC
        if: needs.deploy-dc.result == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rawUrl = '${{ needs.deploy-dc.outputs.web_url }}';
            const webUrl = rawUrl && !rawUrl.startsWith('http') ? `https://${rawUrl}` : rawUrl;
            const ref = context.sha;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'dev-dc',
              auto_merge: false,
              required_contexts: [],
              description: `Deploy dev-dc (${ref.slice(0, 7)})`
            });

            const deploymentId = deployment.data.id;
            if (deploymentId) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId,
                state: 'success',
                environment_url: webUrl || undefined,
                description: 'Deployment finished successfully'
              });
            }

      - name: Create GitHub deployment for CO
        if: needs.deploy-co.result == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const rawUrl = '${{ needs.deploy-co.outputs.web_url }}';
            const webUrl = rawUrl && !rawUrl.startsWith('http') ? `https://${rawUrl}` : rawUrl;
            const ref = context.sha;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'dev-co',
              auto_merge: false,
              required_contexts: [],
              description: `Deploy dev-co (${ref.slice(0, 7)})`
            });

            const deploymentId = deployment.data.id;
            if (deploymentId) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId,
                state: 'success',
                environment_url: webUrl || undefined,
                description: 'Deployment finished successfully'
              });
            }

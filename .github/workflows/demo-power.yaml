name: Demo Power

on:
  workflow_dispatch:
    inputs:
      action:
        description: Turn the demo on or off, or reset its data
        type: choice
        required: true
        options:
          - on
          - off
          - reset
  schedule:
    # 02:00 UTC is 22:00 US Eastern during daylight time (21:00 during standard time).
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  power:
    if: vars.DEMO_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev-demo
    env:
      AWS_REGION: us-east-1
      ACTION: ${{ github.event_name == 'schedule' && 'off' || inputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply demo power action
        run: scripts/demo/power.sh "${ACTION}"

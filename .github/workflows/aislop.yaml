name: aislop

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  scan:
    name: aislop scan (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # aislop's dead-code checks (knip) resolve imports through node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # aislop checks Python with ruff; the baseline was recorded with this version.
      - name: Install ruff
        run: pipx install ruff==0.17.1

      # Scans the whole repo, not just changed files: code scanning compares a PR's
      # alerts against main's, and dismissals only stick to alerts that exist on main.
      - name: Run aislop
        continue-on-error: true
        run: pnpm dlx aislop@0.18.1 scan --sarif > aislop.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: aislop.sarif
          category: aislop

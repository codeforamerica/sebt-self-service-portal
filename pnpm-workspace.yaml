packages:
  - src/SEBT.Portal.Web
  - src/SEBT.EnrollmentChecker.Web
  - packages/*

# [SECURITY] Force-upgrade vulnerable transitive dependencies. Lives here (not in
# package.json's `pnpm.overrides`) because pnpm 11 no longer honors that location.
overrides:
  ws: '>=8.21.0' # CVE-2026-48779 — memory-exhaustion DoS from tiny fragments/chunks (also covers prior uninitialized-memory CVE)
  postcss: '>=8.5.10' # CVE — XSS via unescaped `</style>`
  vite: '>=8.0.16' # CVEs — path traversal, dev-server WS arbitrary read, server.fs.deny bypass; Dependabot alerts #156 #157
  '@lhci/utils>js-yaml': '>=3.15.0 <4.0.0' # CVE — quadratic-complexity DoS via merge key repeated aliases; Dependabot alert #170
  tmp: '>=0.2.6' # CVE-2026-44705 — path traversal via unsanitized prefix/postfix (also covers prior symlink-write CVE)
  uuid: '>=11.1.1' # CVE — missing buffer bounds check
  shell-quote: '>=1.8.4' # CVE-2026-9277 — quote() does not escape newlines in object .op values

# [SECURITY] Enforce minimum package age. Consult Security Team before updating.
minimumReleaseAge: 10080 # 7 days (minutes)

# [SECURITY] Version-pinned exemptions to the cooldown above. Each entry must
# reference a specific package@version, so the exemption ages out automatically
# on the next version bump. Justify each addition with a CVE or ticket link.
minimumReleaseAgeExclude:
  # DC-410: CVE-2026-45109 (High) — middleware/proxy bypass via segment-prefetch.
  # Includes next + its sibling @next/* packages that ship from the same Vercel
  # release. Remove once minimumReleaseAge naturally allows 16.2.6 (after 2026-05-14).
  - next@16.2.6
  - '@next/env@16.2.6'
  - '@next/swc-darwin-arm64@16.2.6'
  - '@next/swc-darwin-x64@16.2.6'
  - '@next/swc-linux-arm64-gnu@16.2.6'
  - '@next/swc-linux-arm64-musl@16.2.6'
  - '@next/swc-linux-x64-gnu@16.2.6'
  - '@next/swc-linux-x64-musl@16.2.6'
  - '@next/swc-win32-arm64-msvc@16.2.6'
  - '@next/swc-win32-x64-msvc@16.2.6'
  # Dependabot alert #170: CVE — quadratic-complexity DoS in merge key handling via repeated aliases.
  # js-yaml 3.15.0 (the patch) was published 2026-06-26, within the 7-day cooldown.
  # Remove once minimumReleaseAge naturally allows 3.15.0 (after 2026-07-03).
  - js-yaml@3.15.0

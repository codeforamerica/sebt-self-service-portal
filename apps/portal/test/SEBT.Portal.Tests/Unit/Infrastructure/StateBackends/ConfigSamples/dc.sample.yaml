baseUrl: http://localhost:8085
auth:
  scheme: api_key
  header: X-Api-Key
  keyRef: dc-api-key
operations:
  householdLookup:
    method: post
    path: /households/lookup
    request:
      isIdentityProofed:
        const: true
      includePendingApplicantDetails:
        const: true
      guardianEmail:
        from: email
      guardianIdentifiers:
        compose:
          IC:
            from: ic
          DOB:
            from: dob
          PortalUUID:
            from: portalUuid
    response:
      root: $.resultSets[0]
      fields:
        summerEBTCaseID:
          from: SummerEBTCaseID
        childFirstName:
          from: ChildFirstName
        childLastName:
          from: ChildLastName
        ebtCardIssueDate:
          from: IssueDate
          format: MM/dd/yyyy
        ebtCardStatus:
          from: CardStatus
          enum: cardStatus
      disaggregation:
        rule: presence
        discriminatorField: ApplicationId
        groupApplicationsBy: ApplicationId
        caseInclusion: all
  cardReplacement:
    method: post
    path: /cards/replace
  health:
    method: get
    path: /health
enums:
  cardStatus:
    map:
      Active: [ACTIVE]
      Lost: [LOST, "LOST, AUTO REISSUE"]
    default: Unknown

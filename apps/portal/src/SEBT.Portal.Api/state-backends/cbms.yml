baseUrl: https://test-ch2-api.state.co.us/ext-uat-c-cbms-cfa-eapi/api/
auth:
  scheme: client_credentials
  tokenUrl: https://test-ch2-api.state.co.us/ext-uat-c-cbms-oauth-app/token
  clientId: b9145338658e4dc9afd9d7ad098aa879
  clientSecretRef: "Cbms:ClientSecret"
operations:
  householdLookup:
    method: post
    path: "sebt/get-account-details?ebtCardService=Y"
    request:
      map:
        phone: phnNm
    response:
      root: $.stdntEnrollDtls
      fields:
        summerEBTCaseID:
          from: sebtChldCwin
        childFirstName:
          from: stdFstNm
        childLastName:
          from: stdLstNm
        childDateOfBirth:
          from: stdDob
          format: yyyy-MM-dd
        householdType:
          value: SEBT
        issuanceType:
          value: SummerEbt
        eligibilityType:
          from: stdntEligSts
        applicationStatus:
          from: stdntEligSts
          enum: applicationStatus
        applicationStudentId:
          from: sebtChldId
        ebtCaseNumber:
          from: cbmsCsId
        caseDisplayNumber:
          from: sebtAppId
        ebtCardLastFour:
          from: ebtCardLastFour
        ebtCardStatus:
          from: ebtCardSts
          enum: cardStatus
        ebtCardIssueDate:
          from: cardIssDt
          format: yyyy-MM-dd
        ebtCardBalance:
          from: cardBal
        benefitAvailableDate:
          from: benAvalDt
          format: yyyy-MM-dd
        benefitExpirationDate:
          from: benExpDt
          format: yyyy-MM-dd
      mailingAddress:
        line1: addrLn1
        line2: addrLn2
        city: cty
        state: staCd
        zip: zip
        zip4: zip4
      caseId:
        fields:
          sebtChldId: sebtChldId
          sebtAppId: sebtAppId
      disaggregation:
        rule: valueInSet
        discriminatorField: eligSrc
        applicationValues: [CBMS, PK]
        groupApplicationsBy: sebtAppId
        caseInclusion: whenApprovedOrNotApplicationBased
  cardReplacement:
    method: patch
    path: sebt/update-std-dtls
    callMode: batch
    request:
      eachCase: true
      map:
        sebtChldId: sebtChldId
        sebtAppId: sebtAppId
      constants:
        reqNewCard: "Y"
    result:
      conditions:
        - outcome: success
          field: respCd
          valueIn: ["200", "00"]
      default: backendError
  addressUpdate:
    method: patch
    path: sebt/update-std-dtls
    request:
      eachCase: true
      map:
        sebtChldId: sebtChldId
        sebtAppId: sebtAppId
        line1: addr.addrLn1
        city: addr.cty
        state: addr.staCd
        zip: addr.zip
      mapOptional:
        line2: addr.addrLn2
        zip4: addr.zip4
    result:
      conditions:
        - outcome: success
          field: respCd
          valueIn: ["200", "00"]
      default: backendError
  enrollmentCheck:
    method: post
    path: sebt/check-enrollment
    callMode: batch
    request:
      expand: transposeMonthDay
      indexField: stdReqInd
      map:
        firstName: stdFirstName
        lastName: stdLastName
        dob: stdDob
      mapOptional:
        schoolIdentifier: stdSchlCd
    response:
      root: $.stdntDtls
      indexField: stdReqInd
      statusMessageField: sebtEligSts
      messageField: respMsg
      match:
        strategy: confidenceThreshold
        scoreField: mtchCnfd
        threshold: 90
        field: sebtEligSts
        valueIn: ["Y"]
  health:
    method: get
    path: ping
enums:
  applicationStatus:
    map:
      Approved: [AP]
      Denied: [DE, OT]
      Pending: [AI, AM, PD, PE, PG, PS]
    default: Unknown
  cardStatus:
    map:
      Active: [ACTIVE]
      Lost: [LOST, "LOST, AUTO REISSUE"]
      Stolen: [STOLEN]
      Damaged: [DAMAGED]
      DeactivatedByState: ["STATUSED BY STATE, NO REISSUE", "DEACTIVATED BY STATE"]
      NotActivated: ["NOT ACTIVATED"]
      Frozen: [FROZEN]
      Undeliverable: [UNDELIVERABLE]
    default: Unknown

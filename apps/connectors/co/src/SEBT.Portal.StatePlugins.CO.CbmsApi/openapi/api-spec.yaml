openapi: 3.0.0
info:
  title: cbms-sebt-eapi
  description:
    This RAML defines the different methods used by SEBT External System to interact with CBMS
    system.
  version: 1.0.22
paths:
  /ping:
    get:
      description: To check if the application is up and running.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                example:
                  response: success
  /sebt: {}
  /sebt/check-enrollment:
    post:
      operationId: Check Enrollment
      description: Validates student enrollment status based on child and school identifiers.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckEnrollmentRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckEnrollmentResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sebt/get-account-details:
    post:
      operationId: Get Account Details
      description: Retrieves SEBT card balances, benefits availability and guardian contact information.
      parameters:
        - name: ebtCardService
          in: query
          required: false
          schema:
            type: string
            enum: ["Y", "N"]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAccountDetailsRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountDetailsResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sebt/update-std-dtls:
    patch:
      operationId: Update Student Details
      description: Updates student address information or requests a new SEBT card.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UpdateStudentDetailsRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStudentDetailsResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CheckEnrollmentRequest:
      example:
        - stdFirstName: John
          stdLastName: Smith
          stdDob: 2012-04-20
          cbmsCsId: C12345
          stdSasId: S98765
          stdSchlCd: SCH44
          sebtYear: "2024"
          stdReqInd: REQ-001
      type: array
      items:
        type: object
        required:
          - stdFirstName
          - stdLastName
          - stdDob
        properties:
          stdFirstName:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          stdLastName:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          stdDob:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          cbmsCsId:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          stdSasId:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          stdSchlCd:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          sebtYear:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
          stdReqInd:
            type: string
            pattern: ^(|[^<>{}\[\]]+)$
    CheckEnrollmentResponse:
      example:
        respCd: "200"
        respMsg: Success
        stdntDtls:
          - stdFstNm: John
            stdLstNm: Doe
            stdDob: 2015-05-15
            mtchCnfd: 95
            sebtStdSts: OT
            stdntEligSts: "N"
            sebtYear: "2024"
            sebtAppSts: RC
            stdReqInd: "1"
            phnNum: ""
      type: object
      required:
        - stdntDtls
      properties:
        respCd:
          description: |
            00 - Success
            04 - No Records Found
          type: string
        respMsg:
          type: string
          pattern: ^(|[^<>{}\[\]]+)$
        stdntDtls:
          type: array
          items:
            $ref: "#/components/schemas/CheckEnrollmentStudentDetail"
    ErrorResponse:
      x-amf-examples:
        example_0:
          apiName: cbms-sebt-eapi-impl
          correlationId: 11174770-a6a1-4949-b216-622e363e872e
          timestamp: 2026-01-30T16:00:35.143Z
          errorDetails:
            - code: "404"
              message: Not Found
        example_1:
          apiName: cbms-sebt-eapi-impl
          correlationId: 11174770-a6a1-4949-b216-622e363e872e
          timestamp: 2026-01-30T16:00:35.143Z
          errorDetails:
            - code: "500"
              message: Internal Server Error
        amf_example_1:
          apiName: cbms-sebt-eapi-impl
          correlationId: 11174770-a6a1-4949-b216-622e363e872e
          timestamp: 2026-01-30T16:00:35.143Z
          errorDetails:
            - code: "400"
              message: Bad Request
      type: object
      properties:
        apiName:
          type: string
          pattern: ^[^<>{}\[\]]+$
        correlationId:
          type: string
          pattern: ^[^<>{}\[\]]+$
        timestamp:
          type: string
          pattern: ^(20\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01]?[0-9]|2[0-3]):([0-5]?[0-9]):([0-5]?[0-9])(\.\d+)?Z$
        errorDetails:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    GetAccountDetailsRequest:
      example:
        phnNm: "3035550199"
      type: object
      required:
        - phnNm
      properties:
        phnNm:
          type: string
          pattern: ^[0-9]{10}$
    GetAccountDetailsResponse:
      example:
        stdntEnrollDtls:
          - gurdFstNm: Jane
            gurdLstNm: Smith
            gurdPhnNm: 970-555-0123
            gurdEmailAddr: jane.smith@example.com
            sebtYear: 2024
            sebtAppId: 556677
            stdFstNm: Johnny
            stdLstNm: Smith
            stdDob: 2016-10-20
            stdntEligSts: AP
            sebtAppSts: ""
            eligSrc: CDE
            sebtChldId: 667076
            sebtChldCwin: 9383037
            addrLn1: 1541 WATER VISTA LN
            addrLn2: ""
            cty: SEVERANCE
            staCd: CO
            zip: "80550"
            zip4: "2881"
            ebtCardLastFour: ""
            benAvalDt: ""
            benExpDt: ""
            ebtCardSts: ""
            cardIssDt: ""
            cardBal: 0
            cbmsCsId: ""
            dircEligSrc: ""
      type: object
      required:
        - stdntEnrollDtls
      properties:
        stdntEnrollDtls:
          type: array
          items:
            $ref: "#/components/schemas/GetAccountStudentDetail"
        respCd:
          type: string
          pattern: ^(|[^<>{}\[\]]+)$
        respMsg:
          type: string
          pattern: ^(|[^<>{}\[\]]+)$
    UpdateStudentDetailsRequest:
      example:
        sebtChldId: CH-88291
        sebtChldCwin: W998877
        addr:
          addrLn1: 456 Oak Street
          addrLn2: Suite 200
          cty: Denver
          staCd: CO
          zip: "80202"
          zip4: "4421"
        reqNewCard: Y
        optOut: N
        gurdFstNm: Jane
        gurdLstNm: Smith
        gurdEmailAddr: jane.smith@example.com
        ntfnOptInSw: Y
        ntfnSrc: email
      type: object
      required:
        - addr
      properties:
        sebtChldId:
          type: string
          pattern: ^\d{1,10}$
          minLength: 1
          maxLength: 10
        sebtAppId:
          type: string
          pattern: ^\d{1,10}$
          minLength: 1
          maxLength: 10
        addr:
          $ref: "#/components/schemas/Address"
        reqNewCard:
          type: string
          pattern: ^[TFYNtfyn]?$
          minLength: 0
          maxLength: 1
        optOut:
          type: string
          pattern: ^[TFYNtfyn]?$
          minLength: 0
          maxLength: 1
        gurdFstNm:
          type: string
          pattern: ^[A-Za-z\-'\s]{1,35}$
          minLength: 1
          maxLength: 35
        gurdLstNm:
          type: string
          pattern: ^[A-Za-z\-'\s]{1,40}$
          minLength: 1
          maxLength: 40
        gurdEmailAddr:
          type: string
          pattern: ^[a-zA-Z0-9._%+\-]{1,64}@[a-zA-Z0-9.\-]{1,255}\.[a-zA-Z]{2,10}$
          minLength: 5
          maxLength: 100
        emailNtfnOptInSw:
          type: string
          pattern: ^[TFYNtfyn]{1}$
          minLength: 1
          maxLength: 1
        textNtfnOptInSw:
          type: string
          pattern: ^[TFYNtfyn]{1}$
          minLength: 1
          maxLength: 1
    CheckEnrollmentStudentDetail:
      type: object
      properties:
        stdFstNm:
          type: string
        stdLstNm:
          type: string
        stdDob:
          type: string
        mtchCnfd:
          type: number
        sebtStdSts:
          description: |
            AI - Address Incomplete
            AM - Application/CDE Mismatch
            AP - Approved
            DD - Denied-Duplicate
            DE - Denied
            DU - Duplicate
            OT - Opted Out
            PD - Potential Duplicate
            PE - Pending
            PG - Pending Verification-Good Cause
            PI - Pending Issuance
            PN - Processed No Issuance
            PS - Pending Verification-Sampled
            PW - Processed With Issuance
            RC - Received
          type: string
        sebtYear:
          type: integer
        sebtAppSts:
          description: |
            AI - Address Incomplete
            AM - Application/CDE Mismatch
            AP - Approved
            DD - Denied-Duplicate
            DE - Denied
            DU - Duplicate
            OT - Opted Out
            PD - Potential Duplicate
            PE - Pending
            PG - Pending Verification-Good Cause
            PI - Pending Issuance
            PN - Processed No Issuance
            PS - Pending Verification-Sampled
            PW - Processed With Issuance
            RC - Received
          type: string
        sebtEligSts:
          description: |
            Y or N
          type: string
        stdReqInd:
          type: string
        phnNum:
          type: string
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          pattern: ^[^<>{}\[\]]+$
        message:
          type: string
          pattern: ^[^<>{}\[\]]+$
    GetAccountStudentDetail:
      type: object
      properties:
        gurdFstNm:
          type: string
        gurdLstNm:
          type: string
        gurdPhnNm:
          type: string
        gurdEmailAddr:
          type: string
        sebtYear:
          type: integer
        sebtAppId:
          type: integer
        stdFstNm:
          type: string
        stdLstNm:
          type: string
        stdDob:
          type: string
        stdntEligSts:
          description: |
            AI - Address Incomplete
            AM - Application/CDE Mismatch
            AP - Approved
            DD - Denied-Duplicate
            DE - Denied
            DU - Duplicate
            OT - Opted Out
            PD - Potential Duplicate
            PE - Pending
            PG - Pending Verification-Good Cause
            PI - Pending Issuance
            PN - Processed No Issuance
            PS - Pending Verification-Sampled
            PW - Processed With Issuance
            RC - Received
          type: string
        sebtAppSts:
          description: |
            AI - Address Incomplete
            AM - Application/CDE Mismatch
            AP - Approved
            DD - Denied-Duplicate
            DE - Denied
            DU - Duplicate
            OT - Opted Out
            PD - Potential Duplicate
            PE - Pending
            PG - Pending Verification-Good Cause
            PI - Pending Issuance
            PN - Processed No Issuance
            PS - Pending Verification-Sampled
            PW - Processed With Issuance
            RC - Received
          type: string
        eligSrc:
          description: |
            PK - Applied through PEAK
            DIRC - Directly enrolled as they are receiving MA or FS or CW benefit
            CDE - Directly Enrolled through CDE
            CBMS - Telephonic Application
          type: string
        sebtChldId:
          type: integer
        sebtChldCwin:
          type: integer
        addrLn1:
          type: string
        addrLn2:
          type: string
        cty:
          type: string
        staCd:
          type: string
        zip:
          type: string
        zip4:
          type: string
        ebtCardLastFour:
          type: string
        benAvalDt:
          type: string
        benExpDt:
          type: string
        ebtCardSts:
          description: |
            ACTIVE
            NOT ACTIVATED
            FROZEN
            LOST
            STOLEN
            DAMAGED
            DAMAGED, AUTO REISSUE
            UNDELIVERABLE
            RETURNED
            DEACTIVATED
            DEACTIVATED, NO REISSUE
            DEACTIVATED BY STATE
            DEACTIVATED/CANCELLED
            CANCELED BY PRIMARY NO REISSUE
            STATUSED BY STATE, NO REISSUE
            UNAUTHORIZED USE, NO REISSUE
            COMPROMISED, NO REISSUE
          type: string
        cardIssDt:
          type: string
        cardBal:
          type: number
        cbmsCsId:
          type: string
        dircEligSrc:
          type: string
    Address:
      type: object
      properties:
        addrLn1:
          type: string
          minLength: 1
          maxLength: 44
        addrLn2:
          type: string
          maxLength: 44
        cty:
          type: string
          pattern: ^[A-Za-z\s\-]{1,50}$
          minLength: 1
          maxLength: 50
        staCd:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
        zip:
          type: string
          pattern: ^\d{5}$
          minLength: 5
          maxLength: 5
        zip4:
          type: string
          pattern: ^\d{4}$
          minLength: 4
          maxLength: 4
    UpdateStudentDetailsResponse:
      example:
        respCd: "200"
        respMsg: Success
      type: object
      properties:
        respCd:
          description: |
            00 - Success
            01 - Error
          type: string
          pattern: ^[^<>]*$
        respMsg:
          type: string
          pattern: ^[^<>]*$
  securitySchemes:
    oauth_2_0:
      type: oauth2
      description: Mule OAuth 2.0.
      x-amf-describedBy:
        headers:
          Authorization:
            description: Used to send a valid OAuth 2 access token.
            type: any
        responses:
          "401":
            description: Bad or expired token.
            headers:
              Content-Type:
                enum:
                  - application/json
                type: any
            body:
              application/json:
                example: '{"message": "API limit exceeded"}'
                type: any
          "403":
            description: Bad or expired token.
            headers:
              Content-Type:
                enum:
                  - application/json
                type: any
            body:
              application/json:
                example: '{"message": "API limit exceeded"}'
                type: any
      flows:
        authorizationCode:
          authorizationUrl: http://0.0.0.0:8081/authorize
          tokenUrl: http://0.0.0.0:8081/access-token
          scopes:
            "*": ""
        password:
          tokenUrl: http://0.0.0.0:8081/access-token
          scopes:
            "*": ""
        clientCredentials:
          tokenUrl: http://0.0.0.0:8081/access-token
          scopes:
            "*": ""
        implicit:
          authorizationUrl: http://0.0.0.0:8081/authorize
          scopes:
            "*": ""
